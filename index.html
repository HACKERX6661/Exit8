<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>The Exit 8 - 3D Fan Game</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
      user-select: none;
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* UI Overlay */
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 10;
    }

    #exit-sign {
      font-size: 28px;
      font-weight: bold;
      color: #ffeb3b;
      background: rgba(0,0,0,0.6);
      padding: 10px 15px;
      border-radius: 5px;
      border: 2px solid #ffeb3b;
      display: inline-block;
    }

    /* Fadenkreuz */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }

    /* Start / Pause Screen */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 20;
    }

    #overlay h1 {
      font-size: 48px;
      margin-bottom: 10px;
      color: #ffeb3b;
      letter-spacing: 2px;
    }

    #overlay p {
      font-size: 18px;
      max-width: 600px;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .rules {
      background: rgba(255,255,255,0.1);
      padding: 15px 25px;
      border-radius: 8px;
      text-align: left;
      margin-bottom: 30px;
    }

    .rules li {
      margin: 8px 0;
    }

    #start-btn {
      padding: 12px 30px;
      font-size: 20px;
      font-weight: bold;
      background: #ffeb3b;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.2s;
    }

    #start-btn:hover {
      background: #fff;
      transform: scale(1.05);
    }
  </style>
  <!-- Three.js Bibliothek -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="game-container"></div>
  
  <div id="crosshair"></div>

  <div id="ui">
    <div id="exit-sign">EXIT <span id="stage-num">0</span></div>
  </div>

  <div id="overlay">
    <h1>THE EXIT 8</h1>
    <p>Du bist in einem endlosen U-Bahn-Tunnel gefangen. Beobachte deine Umgebung genau.</p>
    <div class="rules">
      <ul>
        <li>Übersieh keine Anomalien.</li>
        <li>Wenn du eine Anomalie findest, drehe sofort um!</li>
        <li>Wenn alles normal ist, gehe weiter nach vorne.</li>
        <li>Ziel: Erreiche **EXIT 8**.</li>
      </ul>
    </div>
    <button id="start-btn">SPIEL STARTEN</button>
  </div>

  <script>
    // --- Spiel Variablen ---
    let scene, camera, renderer;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let prevTime = performance.now();
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    
    let isLocked = false;
    let lon = 0, lat = 0;
    let phi = 0, theta = 0;
    
    // Tunnel & Logik
    let currentStage = 0;
    let hasAnomaly = false;
    let activeAnomalyType = 0;
    let triggerZonePassed = false;
    
    // Anomaly Objekte
    let postersGroup, cameraLight, normalLightsGroup;
    let cameraMesh, redCameraLed;

    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const stageNumDisplay = document.getElementById('stage-num');

    // Texturen mit Canvas generieren (Fliesen, Poster, Schränke)
    function createTileTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#e5e5e5'; ctx.fillRect(0, 0, 256, 256);
      ctx.strokeStyle = '#cccccc'; ctx.lineWidth = 4;
      for(let i=0; i<=256; i+=32) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(256, i); ctx.stroke();
      }
      return new THREE.CanvasTexture(canvas);
    }

    function createPosterTexture(text, bgColor, textColor) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 384;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = bgColor; ctx.fillRect(0, 0, 256, 384);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 10; ctx.strokeRect(5, 5, 246, 374);
      ctx.fillStyle = textColor; ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center';
      ctx.fillText(text, 128, 100);
      ctx.fillStyle = '#333'; ctx.font = '16px Arial';
      ctx.fillText("SUBWAY ADVT", 128, 200);
      return new THREE.CanvasTexture(canvas);
    }

    function createMetalDoorTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#5a6572'; ctx.fillRect(0,0,256,512);
      ctx.strokeStyle = '#3a4149'; ctx.lineWidth = 8; ctx.strokeRect(10,10,236,492);
      ctx.fillStyle = '#222'; ctx.fillRect(128-40, 50, 80, 10); // Lüftungsschlitz
      ctx.fillRect(128-40, 70, 80, 10);
      ctx.fillStyle = '#aaaaaa'; ctx.fillRect(30, 250, 15, 30); // Türklinke
      return new THREE.CanvasTexture(canvas);
    }

    const tileTexture = createTileTexture();
    tileTexture.wrapS = THREE.RepeatWrapping;
    tileTexture.wrapT = THREE.RepeatWrapping;

    // --- Init ---
    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050505);
      scene.fog = new THREE.FogExp2(0x050505, 0.025);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.7, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      document.getElementById('game-container').appendChild(renderer.domElement);

      // Map bauen
      buildTunnelLayout();

      // Event Listener
      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);
      document.addEventListener('mousemove', onMouseMove);
      window.addEventListener('resize', onWindowResize);

      startBtn.addEventListener('click', () => {
        document.body.requestPointerLock();
      });

      document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === document.body) {
          isLocked = true;
          overlay.style.display = 'none';
        } else {
          isLocked = false;
          overlay.style.display = 'flex';
        }
      });

      setupStage(0);
      animate();
    }

    // --- Bau des Tunnels mit Abzweigungen (Ecken) ---
    function buildTunnelLayout() {
      const wallMat = new THREE.MeshPhongMaterial({ color: 0xdddddd, map: tileTexture });
      const floorMat = new THREE.MeshPhongMaterial({ color: 0x999999, map: tileTexture });
      const ceilingMat = new THREE.MeshPhongMaterial({ color: 0x222222 });

      tileTexture.repeat.set(4, 20);

      // Maße des Haupttunnels: Breite 4, Höhe 3.5, Länge 40 (z von -20 bis +20)
      const w = 4, h = 3.5, l = 40;

      // Boden & Decke Hauptgang
      const floorGeo = new THREE.PlaneGeometry(w, l);
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const ceiling = new THREE.Mesh(floorGeo, ceilingMat);
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.y = h;
      scene.add(ceiling);

      // Linke Wand (x = -2)
      const wallGeo = new THREE.PlaneGeometry(l, h);
      const leftWall = new THREE.Mesh(wallGeo, wallMat);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-w/2, h/2, 0);
      scene.add(leftWall);

      // Rechte Wand (x = +2)
      const rightWall = new THREE.Mesh(wallGeo, wallMat);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(w/2, h/2, 0);
      scene.add(rightWall);

      // --- ECKEN AN DEN ENDEN (Verhindert schwarze Leere) ---
      // Vorne Einhängung (z = -20 nach Rechts)
      createCornerExtension(0, 0, -l/2, Math.PI / 2, wallMat, floorMat, ceilingMat);
      // Hinten Einhängung (z = +20 nach Links)
      createCornerExtension(0, 0, l/2, -Math.PI / 2, wallMat, floorMat, ceilingMat);

      // --- BELEUCHTUNG ---
      normalLightsGroup = new THREE.Group();
      for (let z = -15; z <= 15; z += 10) {
        // Neonröhren Geometrie
        const lightGeo = new THREE.BoxGeometry(0.2, 0.1, 2);
        const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const lightMesh = new THREE.Mesh(lightGeo, lightMat);
        lightMesh.position.set(0, h - 0.05, z);
        normalLightsGroup.add(lightMesh);

        const pLight = new THREE.PointLight(0xfffaed, 0.8, 12);
        pLight.position.set(0, h - 0.5, z);
        normalLightsGroup.add(pLight);
      }
      scene.add(normalLightsGroup);

      // Umgebungslicht
      const ambLight = new THREE.AmbientLight(0xffffff, 0.2);
      scene.add(ambLight);

      // --- POSTER (Auf der linken Wand) ---
      postersGroup = new THREE.Group();
      const posterTex1 = createPosterTexture("SCHILD A", "#1e88e5", "#ffffff");
      const posterTex2 = createPosterTexture("SCHILD B", "#e53935", "#ffffff");
      const posterTex3 = createPosterTexture("SCHILD C", "#43a047", "#ffffff");

      const pGeo = new THREE.PlaneGeometry(1.2, 1.8);
      const pMat1 = new THREE.MeshPhongMaterial({ map: posterTex1 });
      const pMat2 = new THREE.MeshPhongMaterial({ map: posterTex2 });
      const pMat3 = new THREE.MeshPhongMaterial({ map: posterTex3 });

      const m1 = new THREE.Mesh(pGeo, pMat1); m1.position.set(-w/2 + 0.02, 1.8, -8); m1.rotation.y = Math.PI/2;
      const m2 = new THREE.Mesh(pGeo, pMat2); m2.position.set(-w/2 + 0.02, 1.8, 0);  m2.rotation.y = Math.PI/2;
      const m3 = new THREE.Mesh(pGeo, pMat3); m3.position.set(-w/2 + 0.02, 1.8, 8);  m3.rotation.y = Math.PI/2;

      postersGroup.add(m1, m2, m3);
      scene.add(postersGroup);

      // --- SCHRÄNKE / TÜREN (Auf der rechten Wand) ---
      buildCabinets(w, h);

      // --- KAMERA AN DER DECKE ---
      buildCeilingCamera(h);
    }

    // Hilfsfunktion: Eck-Verlängerungen bauen
    function createCornerExtension(x, y, z, rotationY, wallMat, floorMat, ceilingMat) {
      const cornerGroup = new THREE.Group();
      cornerGroup.position.set(x, y, z);
      cornerGroup.rotation.y = rotationY;

      // Abzweigender Flur
      const extL = 10;
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(4, extL), floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0, 0, extL/2);
      cornerGroup.add(floor);

      const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(4, extL), ceilingMat);
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.set(0, 3.5, extL/2);
      cornerGroup.add(ceiling);

      // Wand am Ende der Ecke (Sackgasse der Abzweigung)
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(4, 3.5), wallMat);
      backWall.position.set(0, 1.75, extL);
      backWall.rotation.y = Math.PI;
      cornerGroup.add(backWall);

      scene.add(cornerGroup);
    }

    // Nischen mit Metalltüren/Schränken auf der rechten Seite
    function buildCabinets(w, h) {
      const cabinetGroup = new THREE.Group();
      const doorTex = createMetalDoorTexture();
      const doorMat = new THREE.MeshPhongMaterial({ map: doorTex });

      const positionsZ = [-10, 2, 12];
      positionsZ.forEach(z => {
        // Schranknische Rahmen
        const frameGeo = new THREE.BoxGeometry(0.2, 2.2, 1.2);
        const frameMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
        const frame = new THREE.Mesh(frameGeo, frameMat);
        frame.position.set(w/2 - 0.05, 1.4, z);
        cabinetGroup.add(frame);

        // Tür
        const doorGeo = new THREE.PlaneGeometry(1.1, 2.1);
        const door = new THREE.Mesh(doorGeo, doorMat);
        door.position.set(w/2 - 0.16, 1.4, z);
        door.rotation.y = -Math.PI / 2;
        cabinetGroup.add(door);
      });

      scene.add(cabinetGroup);
    }

    // Detaillierte Überwachungskamera an der Decke
    function buildCeilingCamera(h) {
      cameraMesh = new THREE.Group();
      
      // Halterung
      const mountGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.3, 8);
      const darkMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
      const mount = new THREE.Mesh(mountGeo, darkMat);
      mount.position.set(0, h - 0.15, -18);
      cameraMesh.add(mount);

      // Gehäuse
      const bodyGeo = new THREE.BoxGeometry(0.2, 0.2, 0.4);
      const bodyMat = new THREE.MeshPhongMaterial({ color: 0xdddddd });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.set(0, h - 0.3, -18);
      body.rotation.x = Math.PI / 6; // Nach unten geneigt
      cameraMesh.add(body);

      // Objektiv
      const lensGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.1, 12);
      const lens = new THREE.Mesh(lensGeo, darkMat);
      lens.rotation.x = Math.PI / 2 + Math.PI / 6;
      lens.position.set(0, h - 0.32, -17.8);
      cameraMesh.add(lens);

      // Rot blinkende LED
      const ledGeo = new THREE.SphereGeometry(0.03, 8, 8);
      const ledMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      redCameraLed = new THREE.Mesh(ledGeo, ledMat);
      redCameraLed.position.set(0.08, h - 0.25, -17.8);
      cameraMesh.add(redCameraLed);

      scene.add(cameraMesh);
    }

    // --- Level Reset & Anomaly Logik ---
    function setupStage(stage) {
      currentStage = stage;
      stageNumDisplay.innerText = currentStage;

      // Kamera zurück zum Startbereich teleportieren
      camera.position.set(0, 1.7, 18);
      triggerZonePassed = false;

      // Zufällig entscheiden, ob Anomaly auftritt (Stage 0 hat NIE eine Anomaly)
      if (stage === 0) {
        hasAnomaly = false;
      } else {
        hasAnomaly = Math.random() < 0.6; // 60% Chance auf Anomaly
      }

      resetAnomalies();

      if (hasAnomaly) {
        activeAnomalyType = Math.floor(Math.random() * 3) + 1;
        applyAnomaly(activeAnomalyType);
      }
    }

    function resetAnomalies() {
      // Normale Skalierung
      postersGroup.children.forEach(p => p.scale.set(1, 1, 1));
      // Normale Beleuchtung
      normalLightsGroup.children.forEach(l => {
        if (l.isPointLight) l.color.setHex(0xfffaed);
      });
      // Kamera Ausrichtung
      cameraMesh.rotation.y = 0;
    }

    function applyAnomaly(type) {
      switch(type) {
        case 1:
          // Anomaly 1: Übergroßes Poster
          postersGroup.children[1].scale.set(1.8, 1.8, 1);
          break;
        case 2:
          // Anomaly 2: Rotes Unheimliches Licht
          normalLightsGroup.children.forEach(l => {
            if (l.isPointLight) l.color.setHex(0xff0000);
          });
          break;
        case 3:
          // Anomaly 3: Kamera dreht sich zum Spieler
          cameraMesh.rotation.y = Math.PI;
          break;
      }
    }

    function checkPlayerProgress() {
      // Spieler geht tief in den Tunnel (z < -10)
      if (!triggerZonePassed && camera.position.z < -10) {
        triggerZonePassed = true;
      }

      // Spieler erreicht das Ende des Tunnels (Vorwärts)
      if (camera.position.z < -18) {
        if (hasAnomaly) {
          // Falsch! Es gab eine Anomaly, aber Spieler ging weiter -> Reset
          setupStage(0);
        } else {
          // Richtig! Keine Anomaly und weitergegangen -> Progress
          setupStage(currentStage + 1);
        }
      }

      // Spieler dreht um und geht zurück (Rückwärts)
      if (triggerZonePassed && camera.position.z > 18) {
        if (hasAnomaly) {
          // Richtig! Anomaly erkannt und umgedreht -> Progress
          setupStage(currentStage + 1);
        } else {
          // Falsch! Keine Anomaly, aber umgedreht -> Reset
          setupStage(0);
        }
      }

      // Win Condition
      if (currentStage >= 8) {
        alert("DU HAST DEN AUSGANG GEFUNDEN! GLÜCKWUNSCH!");
        setupStage(0);
      }
    }

    // --- Input Handling ---
    function onKeyDown(event) {
      switch (event.code) {
        case 'KeyW': case 'ArrowUp': moveForward = true; break;
        case 'KeyS': case 'ArrowDown': moveBackward = true; break;
        case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
        case 'KeyD': case 'ArrowRight': moveRight = true; break;
      }
    }

    function onKeyUp(event) {
      switch (event.code) {
        case 'KeyW': case 'ArrowUp': moveForward = false; break;
        case 'KeyS': case 'ArrowDown': moveBackward = false; break;
        case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
        case 'KeyD': case 'ArrowRight': moveRight = false; break;
      }
    }

    function onMouseMove(event) {
      if (!isLocked) return;
      const movementX = event.movementX || 0;
      const movementY = event.movementY || 0;

      lon += movementX * 0.15;
      lat -= movementY * 0.15;
      lat = Math.max(-85, Math.min(85, lat));
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- Animation Loop ---
    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = (time - prevTime) / 1000;
      prevTime = time;

      if (isLocked) {
        // Blickrichtung berechnen
        phi = THREE.MathUtils.degToRad(90 - lat);
        theta = THREE.MathUtils.degToRad(lon);

        const target = new THREE.Vector3();
        target.x = camera.position.x + Math.sin(phi) * Math.cos(theta);
        target.y = camera.position.y + Math.cos(phi);
        target.z = camera.position.z + Math.sin(phi) * Math.sin(theta);
        camera.lookAt(target);

        // Bewegung & Reibung
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        const speed = 12.0;
        if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

        camera.translateX(-velocity.x * delta);
        camera.translateZ(velocity.z * delta);
        camera.position.y = 1.7; // Feste Höhe

        // Wand-Kollision (Hauptflur Grenzen)
        camera.position.x = Math.max(-1.5, Math.min(1.5, camera.position.x));

        // Blinken der Kameraleuchte
        if (redCameraLed) {
          redCameraLed.material.visible = Math.floor(time / 500) % 2 === 0;
        }

        checkPlayerProgress();
      }

      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>

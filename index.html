<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Exit 8 - Real 3D Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #444;
      padding: 15px 25px;
      border-radius: 6px;
      color: #fff;
      pointer-events: none;
      z-index: 5;
    }
    #ui-overlay h1 {
      font-size: 28px;
      color: #e74c3c;
      letter-spacing: 2px;
      font-weight: 800;
    }
    #ui-overlay p {
      font-size: 13px;
      color: #aaa;
      margin-top: 4px;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
    }
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 10, 0.92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 10;
      cursor: pointer;
    }
    #start-screen h1 {
      font-size: 48px;
      margin-bottom: 10px;
      letter-spacing: 4px;
      color: #f39c12;
    }
    #start-screen p {
      font-size: 16px;
      color: #888;
    }
    #instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      color: #ccc;
      font-size: 13px;
      pointer-events: none;
      z-index: 5;
    }
  </style>
  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="game-container">
    <div id="ui-overlay">
      <h1 id="exit-text">EXIT 0</h1>
      <p>Achte auf Anomalien. Wenn etwas seltsam ist, dreh um!</p>
    </div>

    <div id="crosshair"></div>

    <div id="instructions">
      W / S: Vorwärts / Rückwärts | Maus: Umsehen
    </div>

    <div id="start-screen">
      <h1>8番出口 (EXIT 8)</h1>
      <p>Klicke zum Starten</p>
    </div>
  </div>

  <script>
    // --- CANVAS PROCEDURAL TEXTURES GENERATOR ---
    function createTileTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      
      ctx.fillStyle = '#e5e3dc';
      ctx.fillRect(0, 0, 512, 512);

      ctx.strokeStyle = '#a8a69f';
      ctx.lineWidth = 4;

      const tileSize = 32;
      for (let x = 0; x <= 512; x += tileSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 512);
        ctx.stroke();
      }
      for (let y = 0; y <= 512; y += tileSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(512, y);
        ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    function createFloorTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#d0d2d3';
      ctx.fillRect(0, 0, 512, 512);

      ctx.strokeStyle = '#8a8d90';
      ctx.lineWidth = 3;

      for (let x = 0; x <= 512; x += 64) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
      }
      for (let y = 0; y <= 512; y += 64) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
      }

      // Braille line in middle
      ctx.fillStyle = '#f1c40f';
      ctx.fillRect(224, 0, 64, 512);
      ctx.fillStyle = '#d4ac0d';
      for (let y = 10; y < 512; y += 20) {
        ctx.fillRect(232, y, 48, 8);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    function createPosterTexture(title, color, text) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 384;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = color;
      ctx.fillRect(0, 0, 256, 384);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(10, 10, 236, 364);

      ctx.fillStyle = color;
      ctx.font = 'bold 22px Arial';
      ctx.fillText(title, 20, 50);

      ctx.fillStyle = '#333';
      ctx.font = '14px Arial';
      ctx.fillText(text, 20, 90);

      // Decorative boxes
      ctx.fillStyle = '#eee';
      ctx.fillRect(20, 110, 216, 120);

      const texture = new THREE.CanvasTexture(canvas);
      return texture;
    }

    // --- GAME ENGINE SETUP ---
    const container = document.getElementById('game-container');
    const startScreen = document.getElementById('start-screen');
    const exitText = document.getElementById('exit-text');

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.03);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Textures
    const wallTexture = createTileTexture();
    wallTexture.repeat.set(10, 2);
    const floorTexture = createFloorTexture();
    floorTexture.repeat.set(2, 20);

    const wallMaterial = new THREE.MeshPhongMaterial({ map: wallTexture, roughness: 0.3 });
    const floorMaterial = new THREE.MeshPhongMaterial({ map: floorTexture, roughness: 0.5 });
    const ceilingMaterial = new THREE.MeshPhongMaterial({ color: 0xcccccc, roughness: 0.8 });

    // Tunnel Dimensions
    const TUNNEL_WIDTH = 5;
    const TUNNEL_HEIGHT = 3.5;
    const TUNNEL_LENGTH = 30;

    const tunnelGroup = new THREE.Group();
    scene.add(tunnelGroup);

    // Floor
    const floorGeo = new THREE.PlaneGeometry(TUNNEL_WIDTH, TUNNEL_LENGTH);
    const floor = new THREE.Mesh(floorGeo, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    floor.position.z = -TUNNEL_LENGTH / 2;
    tunnelGroup.add(floor);

    // Ceiling
    const ceilingGeo = new THREE.PlaneGeometry(TUNNEL_WIDTH, TUNNEL_LENGTH);
    const ceiling = new THREE.Mesh(ceilingGeo, ceilingMaterial);
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.y = TUNNEL_HEIGHT;
    ceiling.position.z = -TUNNEL_LENGTH / 2;
    tunnelGroup.add(ceiling);

    // Left Wall
    const leftWallGeo = new THREE.PlaneGeometry(TUNNEL_LENGTH, TUNNEL_HEIGHT);
    const leftWall = new THREE.Mesh(leftWallGeo, wallMaterial);
    leftWall.rotation.y = Math.PI / 2;
    leftWall.position.x = -TUNNEL_WIDTH / 2;
    leftWall.position.y = TUNNEL_HEIGHT / 2;
    leftWall.position.z = -TUNNEL_LENGTH / 2;
    tunnelGroup.add(leftWall);

    // Right Wall
    const rightWall = new THREE.Mesh(leftWallGeo, wallMaterial);
    rightWall.rotation.y = -Math.PI / 2;
    rightWall.position.x = TUNNEL_WIDTH / 2;
    rightWall.position.y = TUNNEL_HEIGHT / 2;
    rightWall.position.z = -TUNNEL_LENGTH / 2;
    tunnelGroup.add(rightWall);

    // Ceiling Lights
    const lights = [];
    for (let z = -4; z > -TUNNEL_LENGTH; z -= 6) {
      const lightGeo = new THREE.BoxGeometry(1.2, 0.1, 0.4);
      const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const lightMesh = new THREE.Mesh(lightGeo, lightMat);
      lightMesh.position.set(0, TUNNEL_HEIGHT - 0.05, z);
      tunnelGroup.add(lightMesh);

      const pLight = new THREE.PointLight(0xfffae6, 0.8, 12);
      pLight.position.set(0, TUNNEL_HEIGHT - 0.2, z);
      tunnelGroup.add(pLight);
      lights.push(pLight);
    }

    // Yellow Exit 8 Sign
    const signCanvas = document.createElement('canvas');
    signCanvas.width = 512; signCanvas.height = 128;
    const sCtx = signCanvas.getContext('2d');
    sCtx.fillStyle = '#f39c12'; sCtx.fillRect(0, 0, 512, 128);
    sCtx.fillStyle = '#000'; sCtx.font = 'bold 60px Arial'; sCtx.textAlign = 'center';
    sCtx.fillText('↑ 出口 8 Exit', 256, 85);
    const signTex = new THREE.CanvasTexture(signCanvas);

    const signGeo = new THREE.BoxGeometry(2.5, 0.6, 0.1);
    const signMat = new THREE.MeshBasicMaterial({ map: signTex });
    const exitSign = new THREE.Mesh(signGeo, signMat);
    exitSign.position.set(0, TUNNEL_HEIGHT - 0.5, -8);
    tunnelGroup.add(exitSign);

    // Posters on Wall
    const posterMaterials = [
      new THREE.MeshBasicMaterial({ map: createPosterTexture('DENTAL CLINIC', '#e74c3c', 'With a Smile / Open 08/08') }),
      new THREE.MeshBasicMaterial({ map: createPosterTexture('JOB OFFER', '#3498db', 'Part time job available now!') }),
      new THREE.MeshBasicMaterial({ map: createPosterTexture('CONCERT 2026', '#2ecc71', 'Live music at Tokyo Dome') })
    ];

    const posterMeshes = [];
    posterMaterials.forEach((mat, idx) => {
      const pGeo = new THREE.PlaneGeometry(0.8, 1.2);
      const pMesh = new THREE.Mesh(pGeo, mat);
      pMesh.position.set(-TUNNEL_WIDTH / 2 + 0.01, 1.8, -10 - idx * 5);
      pMesh.rotation.y = Math.PI / 2;
      tunnelGroup.add(pMesh);
      posterMeshes.push(pMesh);
    });

    // --- MAN IN SUIT CREATION ---
    const manGroup = new THREE.Group();

    // Head
    const headGeo = new THREE.SphereGeometry(0.18, 16, 16);
    const skinMat = new THREE.MeshPhongMaterial({ color: 0xffdbac });
    const head = new THREE.Mesh(headGeo, skinMat);
    head.position.y = 1.65;
    manGroup.add(head);

    // Suit Body
    const suitMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
    const bodyGeo = new THREE.CylinderGeometry(0.22, 0.2, 0.7);
    const body = new THREE.Mesh(bodyGeo, suitMat);
    body.position.y = 1.15;
    manGroup.add(body);

    // Legs
    const legGeo = new THREE.CylinderGeometry(0.08, 0.07, 0.8);
    const leftLeg = new THREE.Mesh(legGeo, suitMat);
    leftLeg.position.set(-0.12, 0.4, 0);
    const rightLeg = new THREE.Mesh(legGeo, suitMat);
    rightLeg.position.set(0.12, 0.4, 0);
    manGroup.add(leftLeg);
    manGroup.add(rightLeg);

    // Briefcase
    const caseGeo = new THREE.BoxGeometry(0.1, 0.25, 0.35);
    const caseMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
    const briefcase = new THREE.Mesh(caseGeo, caseMat);
    briefcase.position.set(0.3, 0.8, 0);
    manGroup.add(briefcase);

    scene.add(manGroup);

    // --- GAME STATE & ANOMALIES ---
    let currentExit = 0;
    let anomalyPresent = false;
    let anomalyType = 0; 
    // Anomalies: 1 = Giant Man, 2 = Red Lights, 3 = Reversed Sign, 4 = Fast Walking Man

    function resetManPosition() {
      manGroup.position.set(0.8, 0, -26);
      manGroup.scale.set(1, 1, 1);
    }
    resetManPosition();

    function triggerNextSection(turnedBack) {
      if (turnedBack) {
        if (anomalyPresent) {
          currentExit++;
        } else {
          currentExit = 0;
        }
      } else {
        if (!anomalyPresent) {
          currentExit++;
        } else {
          currentExit = 0;
        }
      }

      exitText.innerText = `EXIT ${currentExit}`;
      if (currentExit >= 8) {
        alert("🎉 Du hast EXIT 8 erreicht und bist entkommen!");
        currentExit = 0;
        exitText.innerText = `EXIT 0`;
      }

      // Determine new Anomaly
      anomalyPresent = Math.random() < 0.5;
      anomalyType = anomalyPresent ? Math.floor(Math.random() * 4) + 1 : 0;

      // Apply Anomaly Effects
      if (anomalyType === 1) { // Giant Man
        manGroup.scale.set(2.2, 2.2, 2.2);
      } else {
        manGroup.scale.set(1, 1, 1);
      }

      lights.forEach(l => {
        l.color.setHex(anomalyType === 2 ? 0xff0000 : 0xfffae6);
      });

      if (anomalyType === 3) { // Reversed Sign
        exitSign.rotation.y = Math.PI;
      } else {
        exitSign.rotation.y = 0;
      }

      // Reset Player Position to tunnel start
      camera.position.set(0, 1.6, -2);
      resetManPosition();
    }

    // --- CONTROLS SETUP ---
    camera.position.set(0, 1.6, -2);

    let moveForward = false;
    let moveBackward = false;
    let yaw = 0;
    let pitch = 0;

    startScreen.addEventListener('click', () => {
      container.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      if (document.pointerLockElement === container) {
        startScreen.style.display = 'none';
      } else {
        startScreen.style.display = 'flex';
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement === container) {
        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;
        pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- GAME LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      // Camera Rotation
      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;

      // Player Movement
      const moveSpeed = 3.5 * delta;
      if (moveForward) {
        camera.position.z -= moveSpeed;
      }
      if (moveBackward) {
        camera.position.z += moveSpeed;
      }

      // Man Walking Towards Player
      const manSpeed = (anomalyType === 4 ? 4.5 : 1.8) * delta;
      manGroup.position.z += manSpeed;

      // Leg Walking Animation
      const time = clock.getElapsedTime() * 8;
      leftLeg.rotation.x = Math.sin(time) * 0.5;
      rightLeg.rotation.x = -Math.sin(time) * 0.5;

      // Bounds Check / Trigger Logic
      if (camera.position.z < -28) {
        // Walked through to the end forward
        triggerNextSection(false);
      } else if (camera.position.z > 1) {
        // Turned around and walked back out
        triggerNextSection(true);
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>

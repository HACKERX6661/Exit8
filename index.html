<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exit 8 - Browser Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #050505;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px 25px;
      border-radius: 8px;
      border: 1px solid #333;
      pointer-events: none;
    }
    #ui h1 {
      font-size: 24px;
      letter-spacing: 2px;
      color: #e74c3c;
    }
    #ui p {
      font-size: 14px;
      color: #aaa;
      margin-top: 5px;
    }
    #instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      color: #ddd;
      pointer-events: none;
      text-align: center;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #click-to-play {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      cursor: pointer;
    }
    #click-to-play h2 {
      font-size: 36px;
      margin-bottom: 10px;
    }
    #click-to-play p {
      font-size: 16px;
      color: #888;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas"></canvas>
    
    <div id="ui">
      <h1 id="exit-counter">EXIT 0</h1>
      <p id="status-text">Spot anomalies. Turn back if something is wrong.</p>
    </div>

    <div id="instructions">
      W / S: Move Forward / Backward | Mouse: Look Around
    </div>

    <div id="crosshair"></div>

    <div id="click-to-play">
      <h2>EXIT 8</h2>
      <p>Click anywhere to start playing</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const exitCounter = document.getElementById('exit-counter');
    const clickToPlay = document.getElementById('click-to-play');

    let currentExit = 0;
    let anomalyPresent = false;
    let anomalyType = 0; // 0: None, 1: Red Light, 2: Giant Poster, 3: Dark Ceiling, 4: Upside Down Door
    let playerPos = 0; // 0 to 1 inside tunnel
    let playerZ = 0.1; 
    let cameraAngle = 0;
    let isPointerLocked = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Controls
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    clickToPlay.addEventListener('click', () => {
      canvas.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      if (document.pointerLockElement === canvas) {
        isPointerLocked = true;
        clickToPlay.style.display = 'none';
      } else {
        isPointerLocked = false;
        clickToPlay.style.display = 'flex';
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (isPointerLocked) {
        cameraAngle += e.movementX * 0.003;
        // Clamp camera angle
        cameraAngle = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, cameraAngle));
      }
    });

    function nextSection(turnedBack) {
      if (turnedBack) {
        if (anomalyPresent) {
          currentExit++;
        } else {
          currentExit = 0;
        }
      } else {
        if (!anomalyPresent) {
          currentExit++;
        } else {
          currentExit = 0;
        }
      }

      exitCounter.innerText = `EXIT ${currentExit}`;
      if (currentExit >= 8) {
        alert("You reached Exit 8! You escaped!");
        currentExit = 0;
        exitCounter.innerText = `EXIT 0`;
      }

      // Generate new section anomaly
      anomalyPresent = Math.random() < 0.5;
      if (anomalyPresent) {
        anomalyType = Math.floor(Math.random() * 4) + 1;
      } else {
        anomalyType = 0;
      }

      playerZ = 0.5;
    }

    function update() {
      if (!isPointerLocked) return;

      const speed = 0.005;
      if (keys['w'] || keys['arrowup']) {
        playerZ += speed;
      }
      if (keys['s'] || keys['arrowdown']) {
        playerZ -= speed;
      }

      // End of tunnel forward
      if (playerZ >= 1.0) {
        nextSection(false);
      }
      // Turned back completely
      if (playerZ <= 0.0) {
        nextSection(true);
      }
    }

    function draw Corridor() {
      const w = canvas.width;
      const h = canvas.height;

      ctx.fillStyle = (anomalyPresent && anomalyType === 3) ? '#020202' : '#111116';
      ctx.fillRect(0, 0, w, h);

      const fov = 300;
      const cx = w / 2 + Math.sin(cameraAngle) * 400;
      const cy = h / 2;

      // Draw perspective tunnel lines
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;

      // Floor & Ceiling lines
      const vanishingZ = 400;
      
      // Draw lights
      const lightColor = (anomalyPresent && anomalyType === 1) ? '#ff2222' : '#fffde8';
      ctx.fillStyle = lightColor;
      ctx.shadowBlur = 15;
      ctx.shadowColor = lightColor;

      for (let i = 0; i < 5; i++) {
        let z = ((i * 0.2 + playerZ) % 1.0);
        let scale = 1 / (z + 0.1);
        let lw = 80 * scale;
        let lh = 10 * scale;
        let lx = cx - lw / 2;
        let ly = cy - 150 * scale;
        
        ctx.fillRect(lx, ly, lw, lh);
      }
      ctx.shadowBlur = 0;

      // Draw poster / anomaly on wall
      let posterZ = 0.5;
      let pDist = Math.abs(playerZ - posterZ);
      let pScale = 1 / (pDist + 0.2);
      
      let pw = (anomalyPresent && anomalyType === 2 ? 160 : 80) * pScale;
      let ph = (anomalyPresent && anomalyType === 2 ? 220 : 120) * pScale;
      let px = cx + 150 * pScale;
      let py = cy - ph / 2;

      ctx.fillStyle = (anomalyPresent && anomalyType === 4) ? '#9b59b6' : '#3498db';
      ctx.fillRect(px, py, pw, ph);

      // Poster content text
      ctx.fillStyle = '#fff';
      ctx.font = `${14 * pScale}px sans-serif`;
      ctx.fillText(anomalyPresent && anomalyType === 4 ? '??? WARNING' : 'EXIT 8 SIGN', px + 10, py + 30 * pScale);

      // Draw Exit Sign
      let signScale = 1 / (playerZ + 0.1);
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(cx - 50 * signScale, cy - 200 * signScale, 100 * signScale, 40 * signScale);
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${16 * signScale}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(`地下通路 (EXIT ${currentExit})`, cx, cy - 175 * signScale);
      ctx.textAlign = 'left';
    }

    function loop() {
      update();
      drawCorridor();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>

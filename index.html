<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Exit 8 - Performance & WASD Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #ui-overlay {
      position: absolute;
      bottom: 30px;
      right: 30px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #444;
      padding: 15px 25px;
      border-radius: 6px;
      color: #fff;
      pointer-events: none;
      z-index: 5;
      text-align: right;
    }
    #ui-overlay h1 {
      font-size: 32px;
      color: #fff;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .stamina-box {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .stamina-bar-bg {
      width: 140px;
      height: 12px;
      background: #222;
      border: 1px solid #555;
      border-radius: 2px;
      overflow: hidden;
    }
    .stamina-bar-fill {
      width: 100%;
      height: 100%;
      background: #2ecc71;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
    }
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 5, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 10;
      cursor: pointer;
    }
    #start-screen h1 {
      font-size: 52px;
      margin-bottom: 10px;
      letter-spacing: 4px;
      color: #f39c12;
      text-shadow: 0 0 15px rgba(243, 156, 18, 0.5);
    }
    #start-screen p {
      font-size: 16px;
      color: #aaa;
    }
    #instructions {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 16px;
      border-radius: 20px;
      color: #ccc;
      font-size: 13px;
      pointer-events: none;
      z-index: 5;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="game-container">
    <div id="ui-overlay">
      <h1 id="exit-text">EXIT 0</h1>
      <div class="stamina-box">
        <span>STAMINA</span>
        <div class="stamina-bar-bg">
          <div class="stamina-bar-fill"></div>
        </div>
        <span>100%</span>
      </div>
    </div>

    <div id="crosshair"></div>

    <div id="instructions">
      W A S D: Bewegen | Shift: SPRINTEN | Maus: Umsehen
    </div>

    <div id="start-screen">
      <h1>8番出口 (EXIT 8)</h1>
      <p>Klicke zum Starten</p>
    </div>
  </div>

  <script>
    // --- TEXTURES ---
    function createTileTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#dbd9cf'; ctx.fillRect(0, 0, 512, 512);
      ctx.strokeStyle = '#8c8a82'; ctx.lineWidth = 3;
      for (let x = 0; x <= 512; x += 64) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
      }
      for (let y = 0; y <= 512; y += 64) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    function createFloorTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#b0b2b5'; ctx.fillRect(0, 0, 512, 512);
      ctx.strokeStyle = '#5a5d60'; ctx.lineWidth = 3;
      for (let x = 0; x <= 512; x += 128) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
      }
      for (let y = 0; y <= 512; y += 128) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
      }
      ctx.fillStyle = '#d35400'; ctx.fillRect(224, 0, 64, 512);
      ctx.fillStyle = '#f39c12';
      for (let y = 16; y < 512; y += 32) { ctx.fillRect(232, y, 48, 16); }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    // --- 7 POSTERS ---
    function drawPoster(type, options = {}) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 384;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 256, 384);

      if (type === 'smile') {
        ctx.fillStyle = '#3498db'; ctx.fillRect(0, 0, 256, 90);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Arial'; ctx.fillText('ニカッと歯科医院', 20, 55);
        ctx.fillStyle = '#ffdbac'; ctx.beginPath(); ctx.arc(128, 210, 70, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#4a235a'; ctx.beginPath(); ctx.arc(128, 160, 72, Math.PI, Math.PI * 2); ctx.fill();
        if (options.melting) {
          ctx.fillStyle = '#800000';
          ctx.beginPath(); ctx.arc(105, 210, 18, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(150, 225, 22, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillStyle = '#333';
          ctx.beginPath(); ctx.arc(100, 200, 8, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(156, 200, 8, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#3498db'; ctx.fillRect(0, 300, 256, 84);
      } else if (type === 'store') {
        ctx.fillStyle = '#fcf3cf'; ctx.fillRect(0, 0, 256, 384);
        ctx.fillStyle = '#c0392b'; ctx.font = 'bold 24px Arial'; ctx.fillText('商店ポスター', 15, 40);
        ctx.fillStyle = '#e67e22'; ctx.beginPath(); ctx.arc(128, 150, 55, 0, Math.PI * 2); ctx.fill();
      } else if (type === 'dog') {
        ctx.fillStyle = '#e8f8f5'; ctx.fillRect(0, 0, 256, 384);
        ctx.fillStyle = '#27ae60'; ctx.fillRect(0, 0, 256, 50);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Arial'; ctx.fillText('ドッグサロン ズイ', 40, 32);
        ctx.fillStyle = '#f39c12'; ctx.beginPath(); ctx.arc(128, 190, 65, 0, Math.PI * 2); ctx.fill();
      } else if (type === 'concert') {
        ctx.fillStyle = '#111'; ctx.fillRect(0, 0, 256, 384);
        if (options.ghost) {
          ctx.fillStyle = '#eee'; ctx.beginPath(); ctx.arc(128, 175, 60, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#000';
          ctx.beginPath(); ctx.arc(100, 165, 18, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(156, 165, 18, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillStyle = '#8e44ad'; ctx.font = 'bold 22px Arial'; ctx.fillText('2026 CONCERT', 40, 100);
        }
      } else if (type === 'makeup') {
        ctx.fillStyle = '#f5eep6'; ctx.fillRect(0, 0, 256, 384);
        ctx.fillStyle = '#8e44ad'; ctx.font = 'bold 22px Arial'; ctx.fillText('MAKEUP ART', 55, 60);
      } else if (type === 'movefes') {
        ctx.fillStyle = '#1b2631'; ctx.fillRect(0, 0, 256, 384);
        ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 26px Arial'; ctx.fillText('映画フェス', 65, 75);
      } else if (type === 'camera') {
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 256, 384);
        ctx.lineWidth = 8; ctx.strokeStyle = '#000'; ctx.strokeRect(10, 10, 236, 364);
        ctx.fillStyle = '#000'; ctx.fillRect(75, 90, 110, 60);
        const eyeX = options.eyeX || 75;
        ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(eyeX, 120, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.font = 'bold 20px Arial'; ctx.fillText('監視カメラ作動中', 40, 275);
      }
      return new THREE.CanvasTexture(canvas);
    }

    // --- SETUP SCENE ---
    const container = document.getElementById('game-container');
    const startScreen = document.getElementById('start-screen');
    const exitText = document.getElementById('exit-text');

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0a0d, 0.035);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.BasicShadowMap;
    container.appendChild(renderer.domElement);

    const TUNNEL_WIDTH = 6;
    const TUNNEL_HEIGHT = 4;
    const TUNNEL_LENGTH = 36;

    const tunnelGroup = new THREE.Group();
    scene.add(tunnelGroup);

    const wallTex = createTileTexture(); wallTex.repeat.set(12, 2);
    const floorTex = createFloorTexture(); floorTex.repeat.set(2, 24);

    const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.3 });
    const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.4 });
    const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xc8cbd0 });

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(TUNNEL_WIDTH, TUNNEL_LENGTH), floorMat);
    floor.rotation.x = -Math.PI / 2; floor.position.z = -TUNNEL_LENGTH / 2;
    tunnelGroup.add(floor);

    const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(TUNNEL_WIDTH, TUNNEL_LENGTH), ceilingMat);
    ceiling.rotation.x = Math.PI / 2; ceiling.position.y = TUNNEL_HEIGHT; ceiling.position.z = -TUNNEL_LENGTH / 2;
    tunnelGroup.add(ceiling);

    const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(TUNNEL_LENGTH, TUNNEL_HEIGHT), wallMat);
    leftWall.rotation.y = Math.PI / 2; leftWall.position.x = -TUNNEL_WIDTH / 2; leftWall.position.y = TUNNEL_HEIGHT / 2; leftWall.position.z = -TUNNEL_LENGTH / 2;
    tunnelGroup.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(TUNNEL_LENGTH, TUNNEL_HEIGHT), wallMat);
    rightWall.rotation.y = -Math.PI / 2; rightWall.position.x = TUNNEL_WIDTH / 2; rightWall.position.y = TUNNEL_HEIGHT / 2; rightWall.position.z = -TUNNEL_LENGTH / 2;
    tunnelGroup.add(rightWall);

    // Light Fixtures
    const lights = [];
    for (let z = -4; z > -TUNNEL_LENGTH; z -= 8) {
      const pLight = new THREE.PointLight(0xfff8e7, 1.2, 12);
      pLight.position.set(0, TUNNEL_HEIGHT - 0.2, z);
      tunnelGroup.add(pLight);
      lights.push(pLight);
    }

    // Vents & Doors
    const ventMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    for (let z = -7; z > -TUNNEL_LENGTH; z -= 10) {
      const vent = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.05, 1.2), ventMat);
      vent.position.set(-1.8, TUNNEL_HEIGHT - 0.02, z);
      tunnelGroup.add(vent);
    }

    const doorMat = new THREE.MeshStandardMaterial({ color: 0x4a5568 });
    [-12, -24].forEach(zPos => {
      const door = new THREE.Mesh(new THREE.BoxGeometry(0.06, 2.4, 1.2), doorMat);
      door.position.set(TUNNEL_WIDTH / 2 - 0.04, 1.25, zPos);
      tunnelGroup.add(door);
    });

    // Posters
    const posterTypes = ['smile', 'store', 'dog', 'concert', 'makeup', 'movefes', 'camera'];
    const posterMeshes = [];
    const posterGroup = new THREE.Group();
    tunnelGroup.add(posterGroup);

    function createPosters(anomaly = -1) {
      while(posterGroup.children.length > 0) { posterGroup.remove(posterGroup.children[0]); }
      posterMeshes.length = 0;

      const isTakeover = (anomaly === 3);
      const isGrowth = (anomaly === 4);

      posterTypes.forEach((type, idx) => {
        let pType = isTakeover ? 'makeup' : type;
        let opts = {};
        if (type === 'smile' && anomaly === 1) opts.melting = true;
        if (type === 'concert' && anomaly === 2) opts.ghost = true;

        const mat = new THREE.MeshBasicMaterial({ map: drawPoster(pType, opts) });
        const height = isGrowth ? 3.0 : 1.5;
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.0, height), mat);
        mesh.position.set(-TUNNEL_WIDTH / 2 + 0.02, 2.0, -6 - idx * 4);
        mesh.rotation.y = Math.PI / 2;

        posterGroup.add(mesh);
        posterMeshes.push({ mesh, type });
      });
    }

    // Man Model
    const manGroup = new THREE.Group();
    const suitMat = new THREE.MeshStandardMaterial({ color: 0x1c2024 });
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 12), skinMat);
    head.position.y = 1.68; manGroup.add(head);

    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.20, 0.75, 12), suitMat);
    torso.position.y = 1.15; manGroup.add(torso);

    const legGeo = new THREE.CylinderGeometry(0.08, 0.07, 0.85);
    const leftLeg = new THREE.Mesh(legGeo, suitMat); leftLeg.position.set(-0.12, 0.425, 0);
    const rightLeg = new THREE.Mesh(legGeo, suitMat); rightLeg.position.set(0.12, 0.425, 0);
    manGroup.add(leftLeg); manGroup.add(rightLeg);

    scene.add(manGroup);

    function resetMan() { manGroup.position.set(1.0, 0, -32); }
    resetMan();

    // --- GAME STATE ---
    let currentExit = 0;
    let anomalyPresent = false;
    let anomalyType = -1;

    function triggerNextSection(turnedBack) {
      if (turnedBack) {
        currentExit = anomalyPresent ? currentExit + 1 : 0;
      } else {
        currentExit = !anomalyPresent ? currentExit + 1 : 0;
      }

      exitText.innerText = `EXIT ${currentExit}`;
      if (currentExit >= 8) {
        alert("🎉 EXIT 8 ERREICHT! Du bist entkommen!");
        currentExit = 0;
        exitText.innerText = `EXIT 0`;
      }

      anomalyPresent = Math.random() < 0.5;
      anomalyType = anomalyPresent ? Math.floor(Math.random() * 7) : -1;

      lights.forEach(l => {
        l.color.setHex((anomalyPresent && anomalyType === 0) ? 0xff0000 : 0xfff8e7);
      });

      createPosters(anomalyPresent ? anomalyType : -1);
      camera.position.set(0, 1.7, -2);
      resetMan();
    }

    createPosters(-1);

    // --- CONTROLS (WASD + MOUSE) ---
    camera.position.set(0, 1.7, -2);

    let moveFwd = false, moveBwd = false, moveLft = false, moveRgt = false, isSprinting = false;
    let yaw = 0, pitch = 0;

    startScreen.addEventListener('click', () => container.requestPointerLock());

    document.addEventListener('pointerlockchange', () => {
      startScreen.style.display = (document.pointerLockElement === container) ? 'none' : 'flex';
    });

    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement === container) {
        yaw -= e.movementX * 0.0025;
        pitch -= e.movementY * 0.0025;
        pitch = Math.max(-Math.PI / 2.8, Math.min(Math.PI / 2.8, pitch));
      }
    });

    window.addEventListener('keydown', (e) => {
      switch(e.code) {
        case 'KeyW': case 'ArrowUp': moveFwd = true; break;
        case 'KeyS': case 'ArrowDown': moveBwd = true; break;
        case 'KeyA': case 'ArrowLeft': moveLft = true; break;
        case 'KeyD': case 'ArrowRight': moveRgt = true; break;
      }
      if (e.shiftKey) isSprinting = true;
    });

    window.addEventListener('keyup', (e) => {
      switch(e.code) {
        case 'KeyW': case 'ArrowUp': moveFwd = false; break;
        case 'KeyS': case 'ArrowDown': moveBwd = false; break;
        case 'KeyA': case 'ArrowLeft': moveLft = false; break;
        case 'KeyD': case 'ArrowRight': moveRgt = false; break;
      }
      if (!e.shiftKey) isSprinting = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Frustum Culling / Visibility Optimierung
    const frustum = new THREE.Frustum();
    const projScreenMatrix = new THREE.Matrix4();

    function updateVisibility() {
      projScreenMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
      frustum.setFromProjectionMatrix(projScreenMatrix);

      posterGroup.children.forEach(obj => {
        obj.visible = frustum.intersectsObject(obj);
      });
      manGroup.visible = frustum.intersectsObject(torso);
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;

      // Direction Vectors for WASD
      const moveSpeed = (isSprinting ? 6.5 : 4.0) * delta;
      const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
      const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

      if (moveFwd) camera.position.addScaledVector(forward, moveSpeed);
      if (moveBwd) camera.position.addScaledVector(forward, -moveSpeed);
      if (moveLft) camera.position.addScaledVector(side, -moveSpeed);
      if (moveRgt) camera.position.addScaledVector(side, moveSpeed);

      // Clamp player within tunnel bounds
      camera.position.x = Math.max(-TUNNEL_WIDTH / 2 + 0.5, Math.min(TUNNEL_WIDTH / 2 - 0.5, camera.position.x));

      // Man Walking
      manGroup.position.z += 1.8 * delta;
      const legTime = clock.getElapsedTime() * 8;
      leftLeg.rotation.x = Math.sin(legTime) * 0.4;
      rightLeg.rotation.x = -Math.sin(legTime) * 0.4;

      // Anomaly updates
      if (anomalyPresent && anomalyType === 6 && posterMeshes[6]) {
        posterMeshes[6].mesh.position.z = camera.position.z - 3;
      }

      // Hide elements behind player view to boost FPS
      updateVisibility();

      // Loop Triggers
      if (camera.position.z < -34) {
        triggerNextSection(false);
      } else if (camera.position.z > 1) {
        triggerNextSection(true);
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>

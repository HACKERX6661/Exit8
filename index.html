<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>The Exit 8 - 3D Fan Game</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
      user-select: none;
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* UI Overlay */
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 10;
    }

    #exit-sign {
      font-size: 28px;
      font-weight: bold;
      color: #ffeb3b;
      background: rgba(0,0,0,0.6);
      padding: 10px 15px;
      border-radius: 5px;
      border: 2px solid #ffeb3b;
      display: inline-block;
      transition: transform 0.3s ease;
    }

    /* Fadenkreuz */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }

    /* Start / Pause Screen */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 20;
    }

    #overlay h1 {
      font-size: 48px;
      margin-bottom: 10px;
      color: #ffeb3b;
      letter-spacing: 2px;
    }

    #overlay p {
      font-size: 18px;
      max-width: 600px;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .rules {
      background: rgba(255,255,255,0.1);
      padding: 15px 25px;
      border-radius: 8px;
      text-align: left;
      margin-bottom: 30px;
    }

    .rules li {
      margin: 8px 0;
    }

    #start-btn {
      padding: 12px 30px;
      font-size: 20px;
      font-weight: bold;
      background: #ffeb3b;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.2s;
    }

    #start-btn:hover {
      background: #fff;
      transform: scale(1.05);
    }
  </style>
  <!-- Three.js Bibliothek -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="game-container"></div>
  
  <div id="crosshair"></div>

  <div id="ui">
    <div id="exit-sign"><span id="exit-text">EXIT</span> <span id="stage-num">0</span></div>
  </div>

  <div id="overlay">
    <h1>THE EXIT 8</h1>
    <p>Du bist in einem endlosen U-Bahn-Tunnel gefangen. Beobachte deine Umgebung genau.</p>
    <div class="rules">
      <ul>
        <li>Übersieh keine Anomalien.</li>
        <li>Wenn du eine Anomalie findest, drehe sofort um!</li>
        <li>Wenn alles normal ist, gehe weiter nach vorne.</li>
        <li>Ziel: Erreiche **EXIT 8**.</li>
      </ul>
    </div>
    <button id="start-btn">SPIEL STARTEN</button>
  </div>

  <script>
    // --- Spiel Variablen ---
    let scene, camera, renderer;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let prevTime = performance.now();
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    
    let isLocked = false;
    let lon = 0, lat = 0;
    let phi = 0, theta = 0;
    
    // Tunnel & Logik
    let currentStage = 0;
    let hasAnomaly = false;
    let activeAnomalyType = 0;
    let triggerZonePassed = false;
    
    // Referenzen & Anomaly Objekte
    let floorMesh, postersGroup, cameraLight, normalLightsGroup, doorsGroup, ventsGroup;
    let cameraMesh, redCameraLed, ceilingSignMesh, npcGroup;
    let redWaterMesh = null, facelessFigureMesh = null, staircaseMesh = null, dripMesh = null, noEntryGroup = null;
    let pupilMeshLeft = null, pupilMeshRight = null;

    // Dynamic Effect Flags
    let animatePostersSliding = false;
    let trackPlayerWithPoster = false;
    let trackPlayerWithPupils = false;
    let enableFlickeringLights = false;
    let isBlackout = false;
    let doorBanging = false;
    let npcBehavior = 'walk';
    let npcSpeed = 3.5;

    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const stageNumDisplay = document.getElementById('stage-num');
    const exitSignUI = document.getElementById('exit-sign');
    const exitTextUI = document.getElementById('exit-text');

    // Texturen mit Canvas generieren (Fliesen, Poster, Schränke)
    function createTileTexture(faceOverlay = false, uneven = false) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#e5e5e5'; ctx.fillRect(0, 0, 256, 256);
      ctx.strokeStyle = '#cccccc'; ctx.lineWidth = 4;
      
      let step = 32;
      for(let i=0; i<=256; i+=step) {
        if (uneven && i === 64) continue;
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(256, i); ctx.stroke();
      }

      if (faceOverlay) {
        ctx.fillStyle = '#000000';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        for(let x=16; x<256; x+=32) {
          for(let y=16; y<256; y+=32) {
            ctx.beginPath(); ctx.arc(x-4, y-4, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+4, y-4, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x, y+2, 4, 0, Math.PI); ctx.stroke();
          }
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 20);
      return tex;
    }

    function createPosterTexture(text, bgColor, textColor, special = 'none') {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 384;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = bgColor; ctx.fillRect(0, 0, 256, 384);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 10; ctx.strokeRect(5, 5, 246, 374);

      if (special === 'horror') {
        ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, 256, 384);
        ctx.fillStyle = '#ff0000'; ctx.font = 'bold 32px Arial'; ctx.textAlign = 'center';
        ctx.fillText("RUN AWAY", 128, 80);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(80, 200, 25, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(176, 200, 25, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000000';
        ctx.beginPath(); ctx.arc(80, 200, 6, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(176, 200, 6, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(128, 280, 30, 0, Math.PI); ctx.stroke();
      } else if (special === 'disfigured') {
        ctx.fillStyle = textColor; ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center';
        ctx.fillText(text, 128, 100);
        ctx.fillStyle = '#000000';
        ctx.beginPath(); ctx.ellipse(80, 200, 30, 10, 0.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(176, 190, 15, 40, -0.4, 0, Math.PI*2); ctx.fill();
      } else if (special === 'eyes') {
        ctx.fillStyle = textColor; ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center';
        ctx.fillText(text, 128, 80);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(80, 200, 25, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(176, 200, 25, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle = textColor; ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center';
        ctx.fillText(text, 128, 100);
        ctx.fillStyle = '#333'; ctx.font = '16px Arial';
        ctx.fillText("SUBWAY ADVT", 128, 200);
      }
      return new THREE.CanvasTexture(canvas);
    }

    function createMetalDoorTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#5a6572'; ctx.fillRect(0,0,256,512);
      ctx.strokeStyle = '#3a4149'; ctx.lineWidth = 8; ctx.strokeRect(10,10,236,492);
      ctx.fillStyle = '#222'; ctx.fillRect(128-40, 50, 80, 10);
      ctx.fillRect(128-40, 70, 80, 10);
      return new THREE.CanvasTexture(canvas);
    }

    function createTextTexture(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffff00'; ctx.fillRect(0,0,512,128);
      ctx.fillStyle = '#000000'; ctx.font = 'bold 48px Arial'; ctx.textAlign = 'center';
      ctx.fillText(text, 256, 80);
      return new THREE.CanvasTexture(canvas);
    }

    const tileTexture = createTileTexture();

    // --- Init ---
    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050505);
      scene.fog = new THREE.FogExp2(0x050505, 0.025);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.7, 18);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      document.getElementById('game-container').appendChild(renderer.domElement);

      // Map bauen
      buildTunnelLayout();

      // Event Listener
      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);
      document.addEventListener('mousemove', onMouseMove);
      window.addEventListener('resize', onWindowResize);

      startBtn.addEventListener('click', () => {
        document.body.requestPointerLock();
      });

      document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === document.body) {
          isLocked = true;
          overlay.style.display = 'none';
        } else {
          isLocked = false;
          overlay.style.display = 'flex';
        }
      });

      setupStage(0);
      animate();
    }

    // --- Bau des Tunnels mit Abzweigungen (Ecken) ---
    function buildTunnelLayout() {
      const wallMat = new THREE.MeshPhongMaterial({ color: 0xdddddd, map: tileTexture });
      const floorMat = new THREE.MeshPhongMaterial({ color: 0x999999, map: tileTexture });
      const ceilingMat = new THREE.MeshPhongMaterial({ color: 0x222222 });

      const w = 4, h = 3.5, l = 40;

      // Boden & Decke Hauptgang
      floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(w, l), floorMat);
      floorMesh.rotation.x = -Math.PI / 2;
      scene.add(floorMesh);

      const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(w, l), ceilingMat);
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.y = h;
      scene.add(ceiling);

      // Linke Wand
      const wallGeo = new THREE.PlaneGeometry(l, h);
      const leftWall = new THREE.Mesh(wallGeo, wallMat);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-w/2, h/2, 0);
      scene.add(leftWall);

      // Rechte Wand
      const rightWall = new THREE.Mesh(wallGeo, wallMat);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(w/2, h/2, 0);
      scene.add(rightWall);

      // --- ECKEN AN DEN ENDEN ---
      createCornerExtension(0, 0, -l/2, Math.PI / 2, wallMat, floorMat, ceilingMat);
      createCornerExtension(0, 0, l/2, -Math.PI / 2, wallMat, floorMat, ceilingMat);

      // --- BELEUCHTUNG ---
      normalLightsGroup = new THREE.Group();
      for (let z = -15; z <= 15; z += 10) {
        const lightGeo = new THREE.BoxGeometry(0.2, 0.1, 2);
        const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const lightMesh = new THREE.Mesh(lightGeo, lightMat);
        lightMesh.position.set(0, h - 0.05, z);
        normalLightsGroup.add(lightMesh);

        const pLight = new THREE.PointLight(0xfffaed, 0.8, 12);
        pLight.position.set(0, h - 0.5, z);
        normalLightsGroup.add(pLight);
      }
      scene.add(normalLightsGroup);

      const ambLight = new THREE.AmbientLight(0xffffff, 0.25);
      scene.add(ambLight);

      // Deckenschild ("CONCOURSE")
      const signGeo = new THREE.PlaneGeometry(2, 0.5);
      const signMat = new THREE.MeshBasicMaterial({ map: createTextTexture("CONCOURSE") });
      ceilingSignMesh = new THREE.Mesh(signGeo, signMat);
      ceilingSignMesh.position.set(0, h - 0.4, 0);
      scene.add(ceilingSignMesh);

      // POSTER
      postersGroup = new THREE.Group();
      buildPosters(6);
      scene.add(postersGroup);

      // SCHRÄNKE / TÜREN & LÜFTUNGEN
      doorsGroup = new THREE.Group();
      ventsGroup = new THREE.Group();
      buildCabinetsAndVents(w, h);
      scene.add(doorsGroup);
      scene.add(ventsGroup);

      // KAMERA AN DER DECKE
      buildCeilingCamera(h);

      // NPC Gruppe
      npcGroup = new THREE.Group();
      scene.add(npcGroup);
    }

    function createCornerExtension(x, y, z, rotationY, wallMat, floorMat, ceilingMat) {
      const cornerGroup = new THREE.Group();
      cornerGroup.position.set(x, y, z);
      cornerGroup.rotation.y = rotationY;

      const extL = 10;
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(4, extL), floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0, 0, extL/2);
      cornerGroup.add(floor);

      const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(4, extL), ceilingMat);
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.set(0, 3.5, extL/2);
      cornerGroup.add(ceiling);

      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(4, 3.5), wallMat);
      backWall.position.set(0, 1.75, extL);
      backWall.rotation.y = Math.PI;
      cornerGroup.add(backWall);

      scene.add(cornerGroup);
    }

    function buildPosters(count) {
      while(postersGroup.children.length > 0) postersGroup.remove(postersGroup.children[0]);
      const pGeo = new THREE.PlaneGeometry(1.2, 1.8);
      const step = 24 / (count - 1 || 1);
      
      for(let i = 0; i < count; i++) {
        let tex;
        if (i === 1) {
          tex = createPosterTexture("SCHILD B", "#e53935", "#ffffff", 'eyes');
        } else {
          tex = createPosterTexture(`SCHILD ${String.fromCharCode(65+i)}`, i%2===0?"#1e88e5":"#43a047", "#ffffff");
        }
        const mesh = new THREE.Mesh(pGeo, new THREE.MeshPhongMaterial({ map: tex }));
        mesh.position.set(-1.98, 1.8, 12 - (i * step));
        mesh.rotation.y = Math.PI / 2;
        postersGroup.add(mesh);
      }
    }

    function buildCabinetsAndVents(w, h) {
      const doorTex = createMetalDoorTexture();
      const doorMat = new THREE.MeshPhongMaterial({ map: doorTex });
      const ventMat = new THREE.MeshPhongMaterial({ color: 0x222222 });

      const positionsZ = [-10, 0, 10];
      positionsZ.forEach(z => {
        const doorPivot = new THREE.Group();
        doorPivot.position.set(w/2 - 0.05, 1.1, z - 0.6);

        const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.2, 1.2), doorMat);
        doorMesh.position.set(0, 0, 0.6);
        doorPivot.add(doorMesh);

        const knob = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.1), new THREE.MeshPhongMaterial({color: 0xaaaaaa}));
        knob.position.set(-0.05, 0, 0.2);
        knob.name = "knob";
        doorMesh.add(knob);

        doorsGroup.add(doorPivot);

        const vent = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.8), ventMat);
        vent.position.set(w/2 - 0.05, 2.8, z);
        ventsGroup.add(vent);
      });
    }

    function buildCeilingCamera(h) {
      cameraMesh = new THREE.Group();
      
      const mountGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.3, 8);
      const darkMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
      const mount = new THREE.Mesh(mountGeo, darkMat);
      mount.position.set(0, h - 0.15, 0);
      cameraMesh.add(mount);

      const bodyGeo = new THREE.BoxGeometry(0.2, 0.2, 0.4);
      const bodyMat = new THREE.MeshPhongMaterial({ color: 0xdddddd });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.set(0, h - 0.3, 0);
      body.rotation.x = Math.PI / 6;
      cameraMesh.add(body);

      const lensGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.1, 12);
      const lens = new THREE.Mesh(lensGeo, darkMat);
      lens.rotation.x = Math.PI / 2 + Math.PI / 6;
      lens.position.set(0, h - 0.32, 0.2);
      cameraMesh.add(lens);

      const ledGeo = new THREE.SphereGeometry(0.03, 8, 8);
      const ledMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      redCameraLed = new THREE.Mesh(ledGeo, ledMat);
      redCameraLed.position.set(0.08, h - 0.25, 0.2);
      cameraMesh.add(redCameraLed);

      scene.add(cameraMesh);
    }

    function spawnNPC(options = {}) {
      while(npcGroup.children.length > 0) npcGroup.remove(npcGroup.children[0]);

      const scaleY = options.scaleY || 1.0;
      const headColor = options.faceType === 'taped' ? 0xaaaa88 : (options.faceType === 'smiling' ? 0xffddaa : 0x334466);
      const bodyMat = new THREE.MeshPhongMaterial({ color: options.color || 0x223344 });
      const headMat = new THREE.MeshPhongMaterial({ color: headColor });

      const npc = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.4 * scaleY), bodyMat);
      body.position.y = (0.7 * scaleY);
      npc.add(body);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.25 * (scaleY > 1.8 ? 0.7 : 1)), headMat);
      head.position.y = (1.5 * scaleY);
      npc.add(head);

      if (options.faceType === 'smiling') {
        const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.02, 8, 16, Math.PI), new THREE.MeshBasicMaterial({ color: 0x000000 }));
        mouth.position.set(0, 1.45 * scaleY, 0.22);
        mouth.rotation.x = Math.PI;
        npc.add(mouth);
      } else if (options.faceType === 'taped') {
        const tape = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 0.05), new THREE.MeshBasicMaterial({ color: 0x887755 }));
        tape.position.set(0, 1.5 * scaleY, 0.23);
        npc.add(tape);
      }

      npc.position.set(options.xOffset || 0, 0, options.startZ || -18);
      npcGroup.add(npc);

      npcBehavior = options.behavior || 'walk';
      npcSpeed = options.walkSpeed || 3.5;
    }

    // --- Level Reset & Anomaly Logik ---
    function setupStage(stage) {
      currentStage = stage;
      stageNumDisplay.innerText = currentStage;

      camera.position.set(0, 1.7, 18);
      triggerZonePassed = false;

      if (stage === 0) {
        hasAnomaly = false;
      } else {
        hasAnomaly = Math.random() < 0.65;
      }

      resetAnomalies();

      if (hasAnomaly) {
        activeAnomalyType = Math.floor(Math.random() * 33) + 1;
        applyAnomaly(activeAnomalyType);
      }
    }

    function resetAnomalies() {
      floorMesh.material.map = createTileTexture();
      exitSignUI.style.transform = "none";
      exitTextUI.innerText = "EXIT";
      ceilingSignMesh.material.map = createTextTexture("CONCOURSE");

      let lightIdx = 0;
      normalLightsGroup.children.forEach(child => {
        if (child.isPointLight) {
          child.color.setHex(0xfffaed);
          child.intensity = 0.8;
        } else if (child.isMesh) {
          const zPos = -15 + (lightIdx * 10);
          child.position.set(0, 3.45, zPos);
          lightIdx++;
        }
      });

      buildPosters(6);
      doorsGroup.visible = true;
      ventsGroup.visible = true;

      doorsGroup.children.forEach(pivot => {
        pivot.rotation.y = 0;
        const doorMesh = pivot.children[0];
        if (doorMesh) {
          const knob = doorMesh.getObjectByName("knob");
          if (knob) knob.position.set(-0.05, 0, 0.2);
        }
      });

      if (redWaterMesh) { scene.remove(redWaterMesh); redWaterMesh = null; }
      if (facelessFigureMesh) { scene.remove(facelessFigureMesh); facelessFigureMesh = null; }
      if (staircaseMesh) { scene.remove(staircaseMesh); staircaseMesh = null; }
      if (dripMesh) { scene.remove(dripMesh); dripMesh = null; }
      if (noEntryGroup) { scene.remove(noEntryGroup); noEntryGroup = null; }
      if (pupilMeshLeft) { scene.remove(pupilMeshLeft); pupilMeshLeft = null; }
      if (pupilMeshRight) { scene.remove(pupilMeshRight); pupilMeshRight = null; }

      cameraMesh.rotation.y = 0;
      animatePostersSliding = false;
      trackPlayerWithPoster = false;
      trackPlayerWithPupils = false;
      enableFlickeringLights = false;
      isBlackout = false;
      doorBanging = false;

      spawnNPC({ startZ: -18, behavior: 'walk' });
    }

    function applyAnomaly(type) {
      switch(type) {
        case 1: floorMesh.material.map = createTileTexture(true); break;
        case 2:
          redWaterMesh = new THREE.Mesh(new THREE.PlaneGeometry(4, 40), new THREE.MeshBasicMaterial({ color: 0xbb0000, transparent: true, opacity: 0.75 }));
          redWaterMesh.rotation.x = -Math.PI / 2; redWaterMesh.position.y = 0.05;
          scene.add(redWaterMesh);
          break;
        case 3: spawnNPC({ behavior: 'walk', faceType: 'taped' }); break;
        case 4: spawnNPC({ behavior: 'walk', faceType: 'smiling' }); break;
        case 5: spawnNPC({ scaleY: 2.3, walkSpeed: 2.5 }); break;
        case 6: spawnNPC({ walkSpeed: 9.0 }); break;
        case 7: spawnNPC({ behavior: 'stare', startZ: 0 }); break;
        case 8: spawnNPC({ behavior: 'walk', walkSpeed: 0.0, startZ: -5 }); break;
        case 9:
          facelessFigureMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.8), new THREE.MeshBasicMaterial({ color: 0xeeeeee }));
          facelessFigureMesh.position.set(1.2, 0.9, -17);
          scene.add(facelessFigureMesh);
          break;
        case 10:
          staircaseMesh = new THREE.Group();
          for(let i=0; i<6; i++) {
            const step = new THREE.Mesh(new THREE.BoxGeometry(4, 0.3, 0.6), new THREE.MeshPhongMaterial({ color: 0x333333 }));
            step.position.set(0, i*0.3 + 0.15, -16 - (i*0.6));
            staircaseMesh.add(step);
          }
          scene.add(staircaseMesh);
          break;
        case 11: buildPosters(7); break;
        case 12:
          postersGroup.children[postersGroup.children.length - 1].material.map = createPosterTexture("", "", "", "horror");
          break;
        case 13:
          postersGroup.children[1].material.map = createPosterTexture("SCHILD B", "#e53935", "#ffffff", "disfigured");
          break;
        case 14: animatePostersSliding = true; break;
        case 15: trackPlayerWithPoster = true; break;
        case 16:
          trackPlayerWithPupils = true;
          const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
          pupilMeshLeft = new THREE.Mesh(new THREE.SphereGeometry(0.04), eyeMat);
          pupilMeshRight = new THREE.Mesh(new THREE.SphereGeometry(0.04), eyeMat);
          scene.add(pupilMeshLeft); scene.add(pupilMeshRight);
          break;
        case 17: exitSignUI.style.transform = "rotate(180deg)"; break;
        case 18: ceilingSignMesh.material.map = createTextTexture("TURN BACK"); break;
        case 19:
          let idx = 0;
          normalLightsGroup.children.forEach(child => {
            if (child.isMesh) {
              child.position.x = (idx % 2 === 0 ? 0.8 : -0.8);
              child.rotation.y = (idx % 2 === 0 ? 0.3 : -0.3);
              idx++;
            }
          });
          break;
        case 20: redCameraLed.material.color.setHex(0xff0000); break;
        case 21: doorsGroup.children[1].visible = false; break;
        case 22: doorBanging = true; break;
        case 23: doorsGroup.children[0].rotation.y = -0.4; break;
        case 24:
          doorsGroup.children[0].rotation.y = -0.25;
          const peepingEye = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({ color: 0xffffff }));
          peepingEye.position.set(1.85, 1.5, -10.3);
          scene.add(peepingEye);
          break;
        case 25: ventsGroup.visible = false; break;
        case 26:
          dripMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 2.5), new THREE.MeshBasicMaterial({ color: 0x050505 }));
          dripMesh.position.set(1.9, 1.4, 0);
          scene.add(dripMesh);
          break;
        case 27:
          normalLightsGroup.children.forEach(l => { if (l.isPointLight) l.color.setHex(0xffff00); });
          break;
        case 28: enableFlickeringLights = true; break;
        case 29: isBlackout = true; break;
        case 30:
          noEntryGroup = new THREE.Group();
          for(let z=-16; z<=16; z+=4) {
            const sign = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), new THREE.MeshBasicMaterial({ color: 0xcc0000 }));
            sign.position.set(-1.97, 1.8, z);
            sign.rotation.y = Math.PI / 2;
            noEntryGroup.add(sign);
          }
          scene.add(noEntryGroup);
          break;
        case 31:
          spawnNPC({ xOffset: -0.5, startZ: -10 });
          const twin = npcGroup.children[0].clone();
          twin.position.x = 0.5;
          npcGroup.add(twin);
          break;
        case 32:
          const doorMesh = doorsGroup.children[0].children[0];
          if (doorMesh) {
            const knob = doorMesh.getObjectByName("knob");
            if (knob) knob.position.set(-0.05, 0, 0.6);
          }
          break;
        case 33: floorMesh.material.map = createTileTexture(false, true); break;
      }
    }

    function checkPlayerProgress() {
      if (!triggerZonePassed && camera.position.z < -5) triggerZonePassed = true;

      if (camera.position.z < -18) {
        setupStage(hasAnomaly ? 0 : currentStage + 1);
      }

      if (triggerZonePassed && camera.position.z > 18) {
        setupStage(hasAnomaly ? currentStage + 1 : 0);
      }

      if (currentStage >= 8) {
        alert("DU HAST DEN AUSGANG GEFUNDEN! GLÜCKWUNSCH!");
        setupStage(0);
      }
    }

    // --- Input Handling ---
    function onKeyDown(event) {
      switch (event.code) {
        case 'KeyW': case 'ArrowUp': moveForward = true; break;
        case 'KeyS': case 'ArrowDown': moveBackward = true; break;
        case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
        case 'KeyD': case 'ArrowRight': moveRight = true; break;
      }
    }

    function onKeyUp(event) {
      switch (event.code) {
        case 'KeyW': case 'ArrowUp': moveForward = false; break;
        case 'KeyS': case 'ArrowDown': moveBackward = false; break;
        case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
        case 'KeyD': case 'ArrowRight': moveRight = false; break;
      }
    }

    function onMouseMove(event) {
      if (!isLocked) return;
      const movementX = event.movementX || 0;
      const movementY = event.movementY || 0;

      lon += movementX * 0.15;
      lat -= movementY * 0.15;
      lat = Math.max(-85, Math.min(85, lat));
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- Animation Loop ---
    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = (time - prevTime) / 1000;
      prevTime = time;

      if (isLocked) {
        phi = THREE.MathUtils.degToRad(90 - lat);
        theta = THREE.MathUtils.degToRad(lon);

        const target = new THREE.Vector3();
        target.x = camera.position.x + Math.sin(phi) * Math.cos(theta);
        target.y = camera.position.y + Math.cos(phi);
        target.z = camera.position.z + Math.sin(phi) * Math.sin(theta);
        camera.lookAt(target);

        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        const speed = 12.0;
        if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

        camera.translateX(-velocity.x * delta);
        camera.translateZ(velocity.z * delta);
        camera.position.y = 1.7;

        camera.position.x = Math.max(-1.5, Math.min(1.5, camera.position.x));

        // NPC Bewegung
        npcGroup.children.forEach(npc => {
          if (npcBehavior === 'walk') {
            npc.position.z += npcSpeed * delta;
          } else if (npcBehavior === 'stare') {
            npc.lookAt(camera.position.x, npc.position.y, camera.position.z);
          }
        });

        // Dynamic Anomaly Animations
        if (enableFlickeringLights) {
          normalLightsGroup.children.forEach(l => {
            if (l.isPointLight) l.intensity = Math.random() < 0.2 ? 0.1 : 0.8;
          });
        }

        if (isBlackout) {
          normalLightsGroup.children.forEach(l => {
            if (l.isPointLight) l.intensity = 0.02;
          });
        }

        if (doorBanging && doorsGroup.children[0]) {
          doorsGroup.children[0].rotation.y = Math.sin(time * 0.03) * 0.08;
        }

        if (animatePostersSliding) {
          postersGroup.children.forEach(p => {
            p.position.z += 1.2 * delta;
            if (p.position.z > 15) p.position.z = -15;
          });
        }

        if (trackPlayerWithPoster && postersGroup.children[1]) {
          postersGroup.children[1].position.z = camera.position.z;
        }

        if (trackPlayerWithPupils && pupilMeshLeft && pupilMeshRight && postersGroup.children[1]) {
          const posterZ = postersGroup.children[1].position.z;
          const dz = Math.max(-0.2, Math.min(0.2, (camera.position.z - posterZ) * 0.03));
          pupilMeshLeft.position.set(-1.94, 1.8, posterZ + 0.15 + dz);
          pupilMeshRight.position.set(-1.94, 1.8, posterZ - 0.15 + dz);
        }

        if (redCameraLed) {
          redCameraLed.material.visible = Math.floor(time / 500) % 2 === 0;
        }

        checkPlayerProgress();
      }

      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>

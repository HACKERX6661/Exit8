<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Exit 8 - Real Staircase Exit</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #ui-overlay {
      position: absolute;
      bottom: 30px;
      right: 30px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #444;
      padding: 15px 25px;
      border-radius: 6px;
      color: #fff;
      pointer-events: none;
      z-index: 5;
      text-align: right;
    }
    #ui-overlay h1 {
      font-size: 32px;
      color: #fff;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .stamina-box {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .stamina-bar-bg {
      width: 140px;
      height: 12px;
      background: #222;
      border: 1px solid #555;
      border-radius: 2px;
      overflow: hidden;
    }
    .stamina-bar-fill {
      width: 100%;
      height: 100%;
      background: #2ecc71;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
    }
    #interact-prompt {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, 0);
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #fff;
      color: #fff;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      display: none;
      pointer-events: none;
      z-index: 6;
    }
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 5, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 10;
      cursor: pointer;
    }
    #start-screen h1 {
      font-size: 52px;
      margin-bottom: 10px;
      letter-spacing: 4px;
      color: #f39c12;
      text-shadow: 0 0 15px rgba(243, 156, 18, 0.5);
    }
    #start-screen p {
      font-size: 16px;
      color: #aaa;
    }
    #win-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #111;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 2s ease-in-out;
    }
    #win-screen h1 {
      font-size: 64px;
      letter-spacing: 6px;
      margin-bottom: 15px;
    }
    #win-screen p {
      font-size: 20px;
      color: #555;
    }
    #instructions {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 16px;
      border-radius: 20px;
      color: #ccc;
      font-size: 13px;
      pointer-events: none;
      z-index: 5;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="game-container">
    <div id="ui-overlay">
      <h1 id="exit-text">EXIT 0</h1>
      <div class="stamina-box">
        <span>STAMINA</span>
        <div class="stamina-bar-bg">
          <div class="stamina-bar-fill"></div>
        </div>
        <span>100%</span>
      </div>
    </div>

    <div id="crosshair"></div>
    <div id="interact-prompt">[E] Tür öffnen</div>

    <div id="instructions">
      W A S D: Bewegen | E: Interagieren | Shift: SPRINTEN | Maus: Umsehen
    </div>

    <div id="start-screen">
      <h1>8番出口 (EXIT 8)</h1>
      <p>Klicke zum Starten</p>
    </div>

    <div id="win-screen">
      <h1>8番出口 ESCAPED</h1>
      <p>Du hast den Ausgang erfolgreich erreicht!</p>
    </div>
  </div>

  <script>
    // --- HIGH RESOLUTION TEXTURES ---
    function createTileTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#dbd9cf'; ctx.fillRect(0, 0, 1024, 1024);
      ctx.strokeStyle = '#8c8a82'; ctx.lineWidth = 4;
      for (let x = 0; x <= 1024; x += 128) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1024); ctx.stroke();
      }
      for (let y = 0; y <= 1024; y += 128) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    function createFloorTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#b0b2b5'; ctx.fillRect(0, 0, 1024, 1024);
      ctx.strokeStyle = '#5a5d60'; ctx.lineWidth = 4;
      for (let x = 0; x <= 1024; x += 256) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1024); ctx.stroke();
      }
      for (let y = 0; y <= 1024; y += 256) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
      }
      ctx.fillStyle = '#d35400'; ctx.fillRect(448, 0, 128, 1024);
      ctx.fillStyle = '#f39c12';
      for (let y = 32; y < 1024; y += 64) { ctx.fillRect(464, y, 96, 32); }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    function createCeilingTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#9b9e9b'; ctx.fillRect(0, 0, 512, 1024);
      for (let y = 0; y < 1024; y += 32) {
        ctx.fillStyle = '#b5b8b4';
        ctx.fillRect(0, y, 512, 28);
        ctx.fillStyle = '#4a4d4a';
        ctx.fillRect(0, y + 28, 512, 4);
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    function createVentTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#4a4d50'; ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = '#2b2c2e'; ctx.fillRect(30, 30, 452, 452);
      ctx.fillStyle = '#08080a'; ctx.fillRect(45, 45, 422, 422);

      for (let y = 60; y < 450; y += 24) {
        ctx.fillStyle = '#7a7e85'; ctx.fillRect(45, y, 422, 10);
        ctx.fillStyle = '#3a3c40'; ctx.fillRect(45, y + 10, 422, 6);
      }
      ctx.fillStyle = '#8a8e95';
      [20, 492].forEach(x => {
        [20, 492].forEach(y => {
          ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
        });
      });
      return new THREE.CanvasTexture(canvas);
    }

    function createExitSignTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#e6c619'; ctx.fillRect(0, 0, 1024, 256);
      ctx.strokeStyle = '#111111'; ctx.lineWidth = 8; ctx.strokeRect(4, 4, 1016, 248);

      ctx.fillStyle = '#111111'; ctx.textAlign = 'center';
      ctx.font = 'bold 110px sans-serif'; ctx.fillText('↑', 300, 160);
      ctx.font = 'bold 100px "Hiragino Sans", "Meiryo", sans-serif'; ctx.fillText('出口', 520, 140);
      ctx.font = 'bold 36px sans-serif'; ctx.fillText('Exit', 520, 195);
      ctx.font = 'bold 130px sans-serif'; ctx.fillText('8', 720, 170);
      return new THREE.CanvasTexture(canvas);
    }

    // --- NEW VERTICAL YELLOW WALL EXIT SIGN (AS SHOWN IN SCREENSHOT) ---
    function createWallExitSignTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1536;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#f1c40f'; ctx.fillRect(0, 0, 1024, 1536);
      ctx.strokeStyle = '#333333'; ctx.lineWidth = 16; ctx.strokeRect(8, 8, 1008, 1520);

      ctx.fillStyle = '#111111';
      ctx.font = 'bold 80px sans-serif'; ctx.fillText('出口', 100, 160);
      ctx.font = 'bold 240px sans-serif'; ctx.fillText('8', 120, 420);
      ctx.font = 'bold 220px sans-serif'; ctx.fillText('→', 540, 400);

      ctx.font = 'bold 65px "Hiragino Sans", "Meiryo", sans-serif';
      const points = ['海部公園', '水源中学校', '米子寺', '成平大橋', '八本松交番'];
      points.forEach((pt, i) => {
        ctx.fillText(pt, 100, 680 + i * 160);
      });

      return new THREE.CanvasTexture(canvas);
    }

    function createDoorTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 2048;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#2c3e50'; ctx.fillRect(0, 0, 1024, 2048);
      ctx.strokeStyle = '#1a252f'; ctx.lineWidth = 20; ctx.strokeRect(30, 30, 964, 1988);
      ctx.fillStyle = '#34495e'; ctx.fillRect(80, 100, 864, 800); ctx.fillRect(80, 1000, 864, 900);

      ctx.fillStyle = '#f1c40f'; ctx.fillRect(262, 350, 500, 300);
      ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 12; ctx.strokeRect(280, 368, 464, 264);
      ctx.fillStyle = '#000000'; ctx.font = 'bold 75px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('立入禁止', 512, 480);
      ctx.font = 'bold 35px sans-serif'; ctx.fillText('STAFF ONLY', 512, 550);
      return new THREE.CanvasTexture(canvas);
    }

    function drawPoster(type, options = {}) {
      const canvas = document.createElement('canvas');
      canvas.width = 2048; canvas.height = 3072;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 2048, 3072);

      if (type === 'smile') {
        const grad = ctx.createLinearGradient(0, 0, 0, 800);
        grad.addColorStop(0, '#1d6fa5'); grad.addColorStop(1, '#3498db');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, 2048, 800);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 130px sans-serif';
        ctx.fillText('ニカッと歯科医院', 200, 480);

        if (options.melting) {
          ctx.fillStyle = '#e0ac69'; ctx.beginPath(); ctx.arc(1024, 1600, 500, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillStyle = '#ffdbac'; ctx.beginPath(); ctx.arc(1024, 1600, 500, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#1d6fa5'; ctx.fillRect(0, 2400, 2048, 672);
        ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 160px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('08 / 08 GRAND OPEN', 1024, 2800);
      } else {
        ctx.fillStyle = '#fffdf0'; ctx.fillRect(0, 0, 2048, 3072);
        ctx.fillStyle = '#c0392b'; ctx.font = 'bold 180px sans-serif'; ctx.fillText('商店街ポスター', 120, 300);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.generateMipmaps = true;
      return texture;
    }

    // --- SETUP SCENE ---
    const container = document.getElementById('game-container');
    const startScreen = document.getElementById('start-screen');
    const winScreen = document.getElementById('win-screen');
    const exitText = document.getElementById('exit-text');
    const interactPrompt = document.getElementById('interact-prompt');

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0a0d, 0.035);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const TUNNEL_WIDTH = 6;
    const TUNNEL_HEIGHT = 4;
    const TUNNEL_LENGTH = 36;

    const tunnelGroup = new THREE.Group();
    scene.add(tunnelGroup);

    const wallTex = createTileTexture(); wallTex.repeat.set(12, 2);
    const floorTex = createFloorTexture(); floorTex.repeat.set(2, 24);
    const ceilingTex = createCeilingTexture(); ceilingTex.repeat.set(3, 24);

    const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.3 });
    const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.4 });
    const ceilingMat = new THREE.MeshStandardMaterial({ map: ceilingTex, roughness: 0.5 });

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(TUNNEL_WIDTH, TUNNEL_LENGTH), floorMat);
    floor.rotation.x = -Math.PI / 2; floor.position.z = -TUNNEL_LENGTH / 2;
    tunnelGroup.add(floor);

    const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(TUNNEL_WIDTH, TUNNEL_LENGTH), ceilingMat);
    ceiling.rotation.x = Math.PI / 2; ceiling.position.y = TUNNEL_HEIGHT; ceiling.position.z = -TUNNEL_LENGTH / 2;
    tunnelGroup.add(ceiling);

    const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(TUNNEL_LENGTH, TUNNEL_HEIGHT), wallMat);
    leftWall.rotation.y = Math.PI / 2; leftWall.position.x = -TUNNEL_WIDTH / 2; leftWall.position.y = TUNNEL_HEIGHT / 2; leftWall.position.z = -TUNNEL_LENGTH / 2;
    tunnelGroup.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(TUNNEL_LENGTH, TUNNEL_HEIGHT), wallMat);
    rightWall.rotation.y = -Math.PI / 2; rightWall.position.x = TUNNEL_WIDTH / 2; rightWall.position.y = TUNNEL_HEIGHT / 2; rightWall.position.z = -TUNNEL_LENGTH / 2;
    tunnelGroup.add(rightWall);

    // Vents (Wall)
    const ventMat = new THREE.MeshStandardMaterial({ map: createVentTexture(), roughness: 0.4, metalness: 0.3 });
    const ventGeo = new THREE.PlaneGeometry(0.9, 0.9);
    [-6, -18, -30].forEach((zPos) => {
      const ventMesh = new THREE.Mesh(ventGeo, ventMat);
      ventMesh.rotation.y = -Math.PI / 2;
      ventMesh.position.set(TUNNEL_WIDTH / 2 - 0.02, TUNNEL_HEIGHT - 0.75, zPos);
      tunnelGroup.add(ventMesh);
    });

    // Ceiling Exit Sign
    const exitSignMat = new THREE.MeshBasicMaterial({ map: createExitSignTexture() });
    const exitSignMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.0, 0.9), exitSignMat);
    exitSignMesh.position.set(0, TUNNEL_HEIGHT - 0.75, -10);
    tunnelGroup.add(exitSignMesh);

    // --- STAIRCASE EXIT AT END OF CORRIDOR (EXACTLY LIKE SCREENSHOT) ---
    const staircaseGroup = new THREE.Group();
    staircaseGroup.position.set(0, 0, -TUNNEL_LENGTH);

    const stepCount = 20;
    const stepWidth = TUNNEL_WIDTH;
    const stepHeight = 0.25;
    const stepDepth = 0.4;

    const stepMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.4 });
    for (let i = 0; i < stepCount; i++) {
      const step = new THREE.Mesh(new THREE.BoxGeometry(stepWidth, stepHeight, stepDepth), stepMat);
      step.position.set(0, i * stepHeight + stepHeight / 2, -i * stepDepth - stepDepth / 2);
      staircaseGroup.add(step);
    }

    // Side Walls along Stairs
    const stairWallMat = wallMat;
    const stairLeftWall = new THREE.Mesh(new THREE.PlaneGeometry(stepCount * stepDepth * 1.5, TUNNEL_HEIGHT * 2), stairWallMat);
    stairLeftWall.rotation.y = Math.PI / 2;
    stairLeftWall.position.set(-TUNNEL_WIDTH / 2, TUNNEL_HEIGHT, -stepCount * stepDepth / 2);
    staircaseGroup.add(stairLeftWall);

    const stairRightWall = new THREE.Mesh(new THREE.PlaneGeometry(stepCount * stepDepth * 1.5, TUNNEL_HEIGHT * 2), stairWallMat);
    stairRightWall.rotation.y = -Math.PI / 2;
    stairRightWall.position.set(TUNNEL_WIDTH / 2, TUNNEL_HEIGHT, -stepCount * stepDepth / 2);
    staircaseGroup.add(stairRightWall);

    // Bright Glowing Light At Top Of Stairs
    const exitLight = new THREE.PointLight(0xffffff, 8.0, 25);
    exitLight.position.set(0, stepCount * stepHeight + 2, -stepCount * stepDepth + 2);
    staircaseGroup.add(exitLight);

    const brightGlowGeo = new THREE.PlaneGeometry(TUNNEL_WIDTH, TUNNEL_HEIGHT * 2);
    const brightGlowMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
    const brightGlow = new THREE.Mesh(brightGlowGeo, brightGlowMat);
    brightGlow.position.set(0, stepCount * stepHeight, -stepCount * stepDepth);
    staircaseGroup.add(brightGlow);

    // --- YELLOW WALL SIGN (LEFT WALL BEFORE STAIRS) ---
    const wallSignMat = new THREE.MeshStandardMaterial({ map: createWallExitSignTexture(), roughness: 0.2 });
    const wallSignMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 2.4), wallSignMat);
    wallSignMesh.position.set(-TUNNEL_WIDTH / 2 + 0.03, 2.0, -32.5);
    wallSignMesh.rotation.y = Math.PI / 2;
    tunnelGroup.add(wallSignMesh);

    staircaseGroup.visible = false;
    tunnelGroup.add(staircaseGroup);

    // Recessed Lights
    const lightFrameMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const lightBulbMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const lights = [];

    for (let z = -4; z > -TUNNEL_LENGTH; z -= 8) {
      const frame = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.05, 3.2), lightFrameMat);
      frame.position.set(0, TUNNEL_HEIGHT - 0.02, z);
      tunnelGroup.add(frame);

      const bulb = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 3.0), lightBulbMat);
      bulb.rotation.x = Math.PI / 2;
      bulb.position.set(0, TUNNEL_HEIGHT - 0.04, z);
      tunnelGroup.add(bulb);

      const pLight = new THREE.PointLight(0xfff8e7, 1.4, 14);
      pLight.position.set(0, TUNNEL_HEIGHT - 0.3, z);
      tunnelGroup.add(pLight);
      lights.push(pLight);
    }

    // Doors
    const doorTex = createDoorTexture();
    const doorMat = new THREE.MeshStandardMaterial({ map: doorTex, roughness: 0.3, metalness: 0.2 });
    const handleMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.1 });
    const doors = [];

    [-12, -24].forEach((zPos) => {
      const doorPivot = new THREE.Group();
      doorPivot.position.set(TUNNEL_WIDTH / 2 - 0.05, 0, zPos);
      tunnelGroup.add(doorPivot);

      const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.5, 1.3), doorMat);
      doorMesh.position.set(0, 1.25, -0.65);
      doorPivot.add(doorMesh);

      const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.2, 16), handleMat);
      handle.rotation.z = Math.PI / 2;
      handle.position.set(-0.06, 1.25, -1.1);
      doorPivot.add(handle);

      doors.push({ pivot: doorPivot, isOpen: false, targetAngle: 0, z: zPos });
    });

    // Posters
    const posterTypes = ['smile', 'store', 'dog', 'concert', 'makeup', 'movefes', 'camera'];
    const posterGroup = new THREE.Group();
    tunnelGroup.add(posterGroup);

    function createPosters(anomaly = -1) {
      while(posterGroup.children.length > 0) { posterGroup.remove(posterGroup.children[0]); }
      posterTypes.forEach((type, idx) => {
        let opts = {};
        if (type === 'smile' && anomaly === 1) opts.melting = true;
        const posterMat = new THREE.MeshStandardMaterial({ map: drawPoster(type, opts), roughness: 0.2 });
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 1.5), posterMat);
        mesh.position.set(-TUNNEL_WIDTH / 2 + 0.02, 2.0, -6 - idx * 4);
        mesh.rotation.y = Math.PI / 2;
        posterGroup.add(mesh);
      });
    }

    // Man Model
    const manGroup = new THREE.Group();
    const suitMat = new THREE.MeshStandardMaterial({ color: 0x1c2024 });
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 12), skinMat); head.position.y = 1.68; manGroup.add(head);
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.20, 0.75, 12), suitMat); torso.position.y = 1.15; manGroup.add(torso);
    const legGeo = new THREE.CylinderGeometry(0.08, 0.07, 0.85);
    const leftLeg = new THREE.Mesh(legGeo, suitMat); leftLeg.position.set(-0.12, 0.425, 0);
    const rightLeg = new THREE.Mesh(legGeo, suitMat); rightLeg.position.set(0.12, 0.425, 0);
    manGroup.add(leftLeg); manGroup.add(rightLeg);
    scene.add(manGroup);

    function resetMan() { manGroup.position.set(1.0, 0, -32); }
    resetMan();

    // --- GAME STATE ---
    let currentExit = 0;
    let anomalyPresent = false;
    let isGameWon = false;

    function triggerNextSection(turnedBack) {
      if (isGameWon) return;

      if (turnedBack) {
        currentExit = anomalyPresent ? currentExit + 1 : 0;
      } else {
        currentExit = !anomalyPresent ? currentExit + 1 : 0;
      }

      exitText.innerText = `EXIT ${currentExit}`;

      if (currentExit >= 8) {
        staircaseGroup.visible = true;
        anomalyPresent = false;
      } else {
        staircaseGroup.visible = false;
        anomalyPresent = Math.random() < 0.5;
      }

      doors.forEach(d => {
        d.isOpen = false;
        d.targetAngle = 0;
        d.pivot.rotation.y = 0;
      });

      createPosters(anomalyPresent ? 1 : -1);
      camera.position.set(0, 1.7, -2);
      resetMan();
    }

    createPosters(-1);

    // --- CONTROLS ---
    camera.position.set(0, 1.7, -2);
    let moveFwd = false, moveBwd = false, moveLft = false, moveRgt = false, isSprinting = false;
    let yaw = 0, pitch = 0;
    let hoveredDoor = null;

    startScreen.addEventListener('click', () => container.requestPointerLock());

    document.addEventListener('pointerlockchange', () => {
      if (!isGameWon) {
        startScreen.style.display = (document.pointerLockElement === container) ? 'none' : 'flex';
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement === container && !isGameWon) {
        yaw -= e.movementX * 0.0025;
        pitch -= e.movementY * 0.0025;
        pitch = Math.max(-Math.PI / 2.8, Math.min(Math.PI / 2.8, pitch));
      }
    });

    window.addEventListener('keydown', (e) => {
      switch(e.code) {
        case 'KeyW': case 'ArrowUp': moveFwd = true; break;
        case 'KeyS': case 'ArrowDown': moveBwd = true; break;
        case 'KeyA': case 'ArrowLeft': moveLft = true; break;
        case 'KeyD': case 'ArrowRight': moveRgt = true; break;
        case 'KeyE':
          if (hoveredDoor) {
            hoveredDoor.isOpen = !hoveredDoor.isOpen;
            hoveredDoor.targetAngle = hoveredDoor.isOpen ? -Math.PI / 2.2 : 0;
          }
          break;
      }
      if (e.shiftKey) isSprinting = true;
    });

    window.addEventListener('keyup', (e) => {
      switch(e.code) {
        case 'KeyW': case 'ArrowUp': moveFwd = false; break;
        case 'KeyS': case 'ArrowDown': moveBwd = false; break;
        case 'KeyA': case 'ArrowLeft': moveLft = false; break;
        case 'KeyD': case 'ArrowRight': moveRgt = false; break;
      }
      if (!e.shiftKey) isSprinting = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function updateGameLogic(delta) {
      doors.forEach(d => {
        d.pivot.rotation.y += (d.targetAngle - d.pivot.rotation.y) * 8 * delta;
      });

      hoveredDoor = null;
      doors.forEach(d => {
        const dist = camera.position.distanceTo(new THREE.Vector3(TUNNEL_WIDTH / 2 - 0.5, 1.7, d.z - 0.65));
        if (dist < 3.0 && camera.position.x > 0) { hoveredDoor = d; }
      });

      if (hoveredDoor) {
        interactPrompt.style.display = 'block';
        interactPrompt.innerText = hoveredDoor.isOpen ? '[E] Tür schließen' : '[E] Tür öffnen';
      } else {
        interactPrompt.style.display = 'none';
      }
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (!isGameWon) {
        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        const moveSpeed = (isSprinting ? 6.5 : 4.0) * delta;
        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

        if (moveFwd) camera.position.addScaledVector(forward, moveSpeed);
        if (moveBwd) camera.position.addScaledVector(forward, -moveSpeed);
        if (moveLft) camera.position.addScaledVector(side, -moveSpeed);
        if (moveRgt) camera.position.addScaledVector(side, moveSpeed);

        camera.position.x = Math.max(-TUNNEL_WIDTH / 2 + 0.5, Math.min(TUNNEL_WIDTH / 2 - 0.5, camera.position.x));

        // Walking up stairs at Exit 8
        if (currentExit >= 8 && camera.position.z < -35) {
          const stairDist = Math.abs(camera.position.z + 36);
          camera.position.y = 1.7 + stairDist * 0.625;

          if (camera.position.z < -42) {
            isGameWon = true;
            document.exitPointerLock();
            winScreen.style.opacity = '1';
            winScreen.style.pointerEvents = 'auto';
          }
        } else {
          camera.position.y = 1.7;
        }

        manGroup.position.z += 1.8 * delta;
        const legTime = clock.getElapsedTime() * 8;
        leftLeg.rotation.x = Math.sin(legTime) * 0.4;
        rightLeg.rotation.x = -Math.sin(legTime) * 0.4;

        updateGameLogic(delta);

        if (currentExit < 8) {
          if (camera.position.z < -34) {
            triggerNextSection(false);
          } else if (camera.position.z > 1) {
            triggerNextSection(true);
          }
        }
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>

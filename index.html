<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>The Exit 8 - Full Game</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
      user-select: none;
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* UI Overlay */
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 10;
    }

    #exit-sign {
      font-size: 28px;
      font-weight: bold;
      color: #ffeb3b;
      background: rgba(0,0,0,0.6);
      padding: 10px 15px;
      border-radius: 5px;
      border: 2px solid #ffeb3b;
      display: inline-block;
      transition: transform 0.3s ease;
    }

    /* Fadenkreuz */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }

    /* Start / Pause Screen */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 20;
    }

    #overlay h1 {
      font-size: 48px;
      margin-bottom: 10px;
      color: #ffeb3b;
      letter-spacing: 2px;
    }

    #overlay p {
      font-size: 18px;
      max-width: 600px;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .rules {
      background: rgba(255,255,255,0.1);
      padding: 15px 25px;
      border-radius: 8px;
      text-align: left;
      margin-bottom: 30px;
    }

    .rules li {
      margin: 8px 0;
    }

    #start-btn {
      padding: 12px 30px;
      font-size: 20px;
      font-weight: bold;
      background: #ffeb3b;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.2s;
    }

    #start-btn:hover {
      background: #fff;
      transform: scale(1.05);
    }
  </style>
  <!-- Three.js Bibliothek -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="game-container"></div>
  <div id="crosshair"></div>

  <div id="ui">
    <div id="exit-sign"><span id="exit-text">EXIT</span> <span id="stage-num">0</span></div>
  </div>

  <div id="overlay">
    <h1>THE EXIT 8</h1>
    <p>Du bist in einem endlosen U-Bahn-Tunnel gefangen. Beobachte deine Umgebung genau.</p>
    <div class="rules">
      <ul>
        <li>Übersieh keine Anomalien.</li>
        <li>Wenn du eine Anomalie findest, drehe sofort um!</li>
        <li>Wenn alles normal ist, gehe weiter nach vorne.</li>
        <li>Ziel: Erreiche **EXIT 8**.</li>
      </ul>
    </div>
    <button id="start-btn">SPIEL STARTEN</button>
  </div>

  <script>
    // --- Spiel Variablen ---
    let scene, camera, renderer;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let prevTime = performance.now();
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    
    let isLocked = false;
    let lon = 0, lat = 0;
    let phi = 0, theta = 0;
    
    // Tunnel & Logik
    let currentStage = 0;
    let hasAnomaly = false;
    let activeAnomalyType = 0;
    let triggerZonePassed = false;
    
    // 3D Gruppen & Objekte
    let floorMesh, postersGroup, normalLightsGroup, doorsGroup, ventsGroup, cctvCameraMesh, cameraLedMesh, ceilingSignMesh, npcGroup;
    let redWaterMesh = null, facelessFigureMesh = null;

    // Dynamische Effekt-Flags
    let animatePostersSliding = false;
    let trackPlayerWithPoster = false;
    let trackPlayerWithPupils = false;
    let enableFlickeringLights = false;
    let blinkCameraLed = false;
    let npcBehavior = 'walk';
    let npcSpeed = 3.5;

    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const stageNumDisplay = document.getElementById('stage-num');
    const exitSignUI = document.getElementById('exit-sign');
    const exitTextUI = document.getElementById('exit-text');

    // --- TEXTUR-GENERATOREN ---
    function createTileTexture(faceOverlay = false, uneven = false) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#e5e5e5'; ctx.fillRect(0, 0, 256, 256);
      ctx.strokeStyle = '#cccccc'; ctx.lineWidth = 4;
      
      let step = 32;
      for(let i=0; i<=256; i+=step) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(256, i); ctx.stroke();
      }

      if (faceOverlay) {
        ctx.fillStyle = '#000000';
        for(let x=16; x<256; x+=32) {
          for(let y=16; y<256; y+=32) {
            ctx.beginPath(); ctx.arc(x, y-4, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+6, y-4, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+3, y+4, 4, 0, Math.PI); ctx.stroke();
          }
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 20);
      return tex;
    }

    function createPosterTexture(text, bgColor, textColor, special = 'none') {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 384;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = bgColor; ctx.fillRect(0, 0, 256, 384);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 10; ctx.strokeRect(5, 5, 246, 374);

      if (special === 'horror') {
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,256,384);
        ctx.fillStyle = '#ff0000'; ctx.font = 'bold 36px Arial'; ctx.textAlign = 'center';
        ctx.fillText("DONT LOOK", 128, 100);
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(80, 200, 20, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(176, 200, 20, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(80, 200, 5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(176, 200, 5, 0, Math.PI*2); ctx.fill();
      } else if (special === 'eyes') {
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(80, 180, 30, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(176, 180, 30, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000000'; ctx.beginPath(); ctx.arc(80, 180, 10, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(176, 180, 10, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle = textColor; ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center';
        ctx.fillText(text, 128, 100);
        ctx.fillStyle = '#333'; ctx.font = '16px Arial';
        ctx.fillText("SUBWAY ADVT", 128, 200);
      }
      return new THREE.CanvasTexture(canvas);
    }

    function createTextTexture(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffff00'; ctx.fillRect(0,0,512,128);
      ctx.fillStyle = '#000000'; ctx.font = 'bold 48px Arial'; ctx.textAlign = 'center';
      ctx.fillText(text, 256, 80);
      return new THREE.CanvasTexture(canvas);
    }

    // --- INITIALISIERUNG ---
    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050505);
      scene.fog = new THREE.FogExp2(0x050505, 0.025);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.7, 18);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.getElementById('game-container').appendChild(renderer.domElement);

      buildTunnelLayout();

      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);
      document.addEventListener('mousemove', onMouseMove);
      window.addEventListener('resize', onWindowResize);

      startBtn.addEventListener('click', () => { document.body.requestPointerLock(); });

      document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === document.body) {
          isLocked = true;
          overlay.style.display = 'none';
        } else {
          isLocked = false;
          overlay.style.display = 'flex';
        }
      });

      setupStage(0);
      animate();
    }

    // --- TUNNEL BAUEN ---
    function buildTunnelLayout() {
      const wallMat = new THREE.MeshPhongMaterial({ color: 0xdddddd, map: createTileTexture() });
      const floorMat = new THREE.MeshPhongMaterial({ color: 0x999999, map: createTileTexture() });
      const ceilingMat = new THREE.MeshPhongMaterial({ color: 0x222222 });

      const w = 4, h = 3.5, l = 40;

      // Boden & Decke
      floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(w, l), floorMat);
      floorMesh.rotation.x = -Math.PI / 2;
      scene.add(floorMesh);

      const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(w, l), ceilingMat);
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.y = h;
      scene.add(ceiling);

      // Wände
      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(l, h), wallMat);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-w/2, h/2, 0);
      scene.add(leftWall);

      const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(l, h), wallMat);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(w/2, h/2, 0);
      scene.add(rightWall);

      // Ecken an den Enden (Verhindert schwarze Löcher)
      createCornerExtension(0, 0, -l/2, Math.PI / 2, wallMat, floorMat, ceilingMat);
      createCornerExtension(0, 0, l/2, -Math.PI / 2, wallMat, floorMat, ceilingMat);

      // Beleuchtung
      normalLightsGroup = new THREE.Group();
      for (let z = -15; z <= 15; z += 10) {
        const lightMesh = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        lightMesh.position.set(0, h - 0.05, z);
        normalLightsGroup.add(lightMesh);

        const pLight = new THREE.PointLight(0xfffaed, 0.8, 12);
        pLight.position.set(0, h - 0.5, z);
        normalLightsGroup.add(pLight);
      }
      scene.add(normalLightsGroup);

      scene.add(new THREE.AmbientLight(0xffffff, 0.25));

      // Deckenschild ("CONCOURSE")
      const signGeo = new THREE.PlaneGeometry(2, 0.5);
      const signMat = new THREE.MeshBasicMaterial({ map: createTextTexture("CONCOURSE") });
      ceilingSignMesh = new THREE.Mesh(signGeo, signMat);
      ceilingSignMesh.position.set(0, h - 0.4, 0);
      scene.add(ceilingSignMesh);

      // Poster
      postersGroup = new THREE.Group();
      buildPosters(6);
      scene.add(postersGroup);

      // Türen & Lüftungen
      doorsGroup = new THREE.Group();
      ventsGroup = new THREE.Group();
      buildDoorsAndVents(w, h);
      scene.add(doorsGroup);
      scene.add(ventsGroup);

      // CCTV Kamera
      buildCctvCamera(h);

      // NPC Gruppe
      npcGroup = new THREE.Group();
      scene.add(npcGroup);
    }

    function createCornerExtension(x, y, z, rotationY, wallMat, floorMat, ceilingMat) {
      const corner = new THREE.Group();
      corner.position.set(x, y, z);
      corner.rotation.y = rotationY;
      const extL = 10;

      const fl = new THREE.Mesh(new THREE.PlaneGeometry(4, extL), floorMat);
      fl.rotation.x = -Math.PI / 2; fl.position.set(0, 0, extL/2);
      corner.add(fl);

      const cl = new THREE.Mesh(new THREE.PlaneGeometry(4, extL), ceilingMat);
      cl.rotation.x = Math.PI / 2; cl.position.set(0, 3.5, extL/2);
      corner.add(cl);

      const bw = new THREE.Mesh(new THREE.PlaneGeometry(4, 3.5), wallMat);
      bw.position.set(0, 1.75, extL); bw.rotation.y = Math.PI;
      corner.add(bw);

      scene.add(corner);
    }

    function buildPosters(count) {
      while(postersGroup.children.length > 0) postersGroup.remove(postersGroup.children[0]);
      const pGeo = new THREE.PlaneGeometry(1.2, 1.8);
      const step = 24 / (count - 1 || 1);
      
      for(let i = 0; i < count; i++) {
        const tex = createPosterTexture(`POSTER ${i+1}`, i%2===0?"#1e88e5":"#e53935", "#ffffff", i===1?'eyes':'none');
        const mesh = new THREE.Mesh(pGeo, new THREE.MeshPhongMaterial({ map: tex }));
        mesh.position.set(-1.98, 1.8, 12 - (i * step));
        mesh.rotation.y = Math.PI / 2;
        postersGroup.add(mesh);
      }
    }

    function buildDoorsAndVents(w, h) {
      const doorMat = new THREE.MeshPhongMaterial({ color: 0x5a6572 });
      const ventMat = new THREE.MeshPhongMaterial({ color: 0x222222 });

      [-10, 0, 10].forEach(z => {
        const door = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.2, 1.2), doorMat);
        door.position.set(w/2 - 0.05, 1.1, z);
        
        // Türklinke
        const knob = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.1), new THREE.MeshPhongMaterial({color: 0xaaaaaa}));
        knob.position.set(-0.05, 0, -0.4);
        knob.name = "knob";
        door.add(knob);

        doorsGroup.add(door);

        const vent = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.8), ventMat);
        vent.position.set(w/2 - 0.05, 2.8, z);
        ventsGroup.add(vent);
      });
    }

    function buildCctvCamera(h) {
      cctvCameraMesh = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.4), new THREE.MeshPhongMaterial({ color: 0xdddddd }));
      body.position.set(0, h - 0.3, 0);
      cctvCameraMesh.add(body);

      cameraLedMesh = new THREE.Mesh(new THREE.SphereGeometry(0.03), new THREE.MeshBasicMaterial({ color: 0x330000 }));
      cameraLedMesh.position.set(0.08, h - 0.25, 0.2);
      cctvCameraMesh.add(cameraLedMesh);

      scene.add(cctvCameraMesh);
    }

    function spawnNPC(options = {}) {
      while(npcGroup.children.length > 0) npcGroup.remove(npcGroup.children[0]);

      const scaleY = options.scaleY || 1.0;
      const npcMat = new THREE.MeshPhongMaterial({ color: options.color || 0x334466 });
      
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.4 * scaleY), npcMat);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.25 * (scaleY > 1.5 ? 0.7 : 1)), npcMat);
      head.position.y = (0.9 * scaleY);
      
      const npc = new THREE.Group();
      npc.add(body); npc.add(head);
      npc.position.set(options.xOffset || 0, 0.9 * scaleY, options.startZ || -15);
      
      npcGroup.add(npc);
      npcBehavior = options.behavior || 'walk';
      npcSpeed = options.walkSpeed || 3.5;
    }

    // --- LEVEL STAGE RESET & ANOMALIE STEUERUNG ---
    function setupStage(stage) {
      currentStage = stage;
      stageNumDisplay.innerText = currentStage;

      camera.position.set(0, 1.7, 18);
      triggerZonePassed = false;

      // Stage 0 ist immer normal
      hasAnomaly = (stage === 0) ? false : Math.random() < 0.7;

      resetStageToNormal();

      if (hasAnomaly) {
        // Zufällige Auswahl aus den 33 Anomalien
        activeAnomalyType = Math.floor(Math.random() * 33) + 1;
        applyAnomaly(activeAnomalyType);
      }
    }

    function resetStageToNormal() {
      floorMesh.material.map = createTileTexture();
      exitSignUI.style.transform = "none";
      exitTextUI.innerText = "EXIT";
      ceilingSignMesh.material.map = createTextTexture("CONCOURSE");
      
      normalLightsGroup.children.forEach(l => {
        if(l.isPointLight) { l.color.setHex(0xfffaed); l.intensity = 0.8; }
        l.position.x = 0;
      });

      buildPosters(6);
      doorsGroup.visible = true;
      ventsGroup.visible = true;
      
      doorsGroup.children.forEach(door => {
        door.rotation.y = 0;
        const knob = door.getObjectByName("knob");
        if(knob) knob.position.set(-0.05, 0, -0.4);
      });

      if(redWaterMesh) { scene.remove(redWaterMesh); redWaterMesh = null; }
      if(facelessFigureMesh) { scene.remove(facelessFigureMesh); facelessFigureMesh = null; }

      animatePostersSliding = false;
      trackPlayerWithPoster = false;
      trackPlayerWithPupils = false;
      enableFlickeringLights = false;
      blinkCameraLed = false;
      cameraLedMesh.material.color.setHex(0x330000);

      spawnNPC({ startZ: -18, behavior: 'walk' });
    }

    // --- ANOMALIEN IMPLEMENTIERUNG ---
    function applyAnomaly(type) {
      switch(type) {
        case 1: floorMesh.material.map = createTileTexture(true); break; // Gelbe Fliesen mit Gesichtern
        case 2: // Rotes Wasser
          redWaterMesh = new THREE.Mesh(new THREE.PlaneGeometry(4, 40), new THREE.MeshBasicMaterial({ color: 0xaa0000, transparent: true, opacity: 0.7 }));
          redWaterMesh.rotation.x = -Math.PI / 2; redWaterMesh.position.y = 0.05;
          scene.add(redWaterMesh);
          break;
        case 3: spawnNPC({ behavior: 'walk', color: 0x888877 }); break; // Taped Face Man
        case 4: spawnNPC({ behavior: 'walk', color: 0xffccaa }); break; // Smiling Face Man
        case 5: spawnNPC({ scaleY: 2.2, walkSpeed: 2.0 }); break; // Very tall man
        case 6: spawnNPC({ walkSpeed: 8.0 }); break; // Fast walking man
        case 7: spawnNPC({ behavior: 'stare', startZ: 0 }); break; // Staring man
        case 8: // White faceless figure
          facelessFigureMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
          facelessFigureMesh.position.set(1.2, 0.9, -16);
          scene.add(facelessFigureMesh);
          break;
        case 9: // Treppe am Ende
          const stair = new THREE.Mesh(new THREE.BoxGeometry(4, 1, 4), new THREE.MeshPhongMaterial({ color: 0x444444 }));
          stair.position.set(0, 0.5, -18); scene.add(stair);
          break;
        case 10: buildPosters(7); break; // 7 Poster statt 6
        case 11: // Horror Movefes Poster
          postersGroup.children[postersGroup.children.length - 1].material.map = createPosterTexture("", "", "", "horror");
          break;
        case 12: // Disfigured eyes poster
          postersGroup.children[1].material.map = createPosterTexture("", "", "", "horror");
          break;
        case 13: animatePostersSliding = true; break; // Poster wandern
        case 14: trackPlayerWithPoster = true; break; // Poster folgt Bewegung
        case 15: trackPlayerWithPupils = true; break; // Pupillen folgen Bewegung
        case 16: exitSignUI.style.transform = "rotate(180deg)"; break; // Inverted Exit Sign
        case 17: ceilingSignMesh.material.map = createTextTexture("TURN BACK"); break; // Turn Back Sign
        case 18: // Verstragte Lichter
          normalLightsGroup.children.forEach(l => l.position.x = (Math.random() - 0.5) * 1.5);
          break;
        case 19: blinkCameraLed = true; break; // Blinkende CCTV LED
        case 20: doorsGroup.children[1].visible = false; break; // Tür fehlt
        case 21: // Banging Door (Animation im Loop)
          doorsGroup.children[0].rotation.y = 0.05;
          break;
        case 22: doorsGroup.children[0].rotation.y = -0.4; break; // Tür öffnet sich leicht
        case 23: // Peeping from door
          doorsGroup.children[0].rotation.y = -0.3;
          const eye = new THREE.Mesh(new THREE.SphereGeometry(0.08), new THREE.MeshBasicMaterial({ color: 0xffffff }));
          eye.position.set(1.8, 1.5, -10); scene.add(eye);
          break;
        case 24: ventsGroup.visible = false; break; // Vent windows missing
        case 25: // Black liquid dripping
          const drip = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.5, 0.1), new THREE.MeshBasicMaterial({ color: 0x000000 }));
          drip.position.set(1.9, 2.0, 0); scene.add(drip);
          break;
        case 26: // Bright yellow lighting
          normalLightsGroup.children.forEach(l => { if(l.isPointLight) l.color.setHex(0xffff00); });
          break;
        case 27: enableFlickeringLights = true; break; // Flackernde Lichter
        case 28: // Sudden Blackout Zone
          normalLightsGroup.children.forEach(l => { if(l.isPointLight) l.intensity = 0.05; });
          break;
        case 29: // No Entry Signs überall
          for(let z=-15; z<=15; z+=5) {
            const noEntry = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.6), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
            noEntry.position.set(-1.98, 2.2, z); noEntry.rotation.y = Math.PI/2;
            scene.add(noEntry);
          }
          break;
        case 30: // Twin men
          spawnNPC({ xOffset: -0.6, startZ: -10 });
          const twin = npcGroup.children[0].clone();
          twin.position.x = 0.6;
          npcGroup.add(twin);
          break;
        case 31: // Türknauf in der Mitte
          const knob = doorsGroup.children[0].getObjectByName("knob");
          if(knob) knob.position.set(-0.05, 0, 0);
          break;
        case 32: floorMesh.material.map = createTileTexture(false, true); break; // Uneven Tiles
        case 33: spawnNPC({ walkSpeed: 0.0 }); break; // Man stops in hallway
      }
    }

    function checkPlayerProgress() {
      if (!triggerZonePassed && camera.position.z < -5) triggerZonePassed = true;

      // Vorwärts durchgelaufen
      if (camera.position.z < -18) {
        setupStage(hasAnomaly ? 0 : currentStage + 1);
      }

      // Umgedreht und zurückgelaufen
      if (triggerZonePassed && camera.position.z > 18) {
        setupStage(hasAnomaly ? currentStage + 1 : 0);
      }

      if (currentStage >= 8) {
        alert("GEWONNEN! Du hast EXIT 8 erreicht!");
        setupStage(0);
      }
    }

    // --- INPUT & ANIMATION LOOP ---
    function onKeyDown(e) {
      if(e.code==='KeyW'||e.code==='ArrowUp') moveForward = true;
      if(e.code==='KeyS'||e.code==='ArrowDown') moveBackward = true;
      if(e.code==='KeyA'||e.code==='ArrowLeft') moveLeft = true;
      if(e.code==='KeyD'||e.code==='ArrowRight') moveRight = true;
    }
    function onKeyUp(e) {
      if(e.code==='KeyW'||e.code==='ArrowUp') moveForward = false;
      if(e.code==='KeyS'||e.code==='ArrowDown') moveBackward = false;
      if(e.code==='KeyA'||e.code==='ArrowLeft') moveLeft = false;
      if(e.code==='KeyD'||e.code==='ArrowRight') moveRight = false;
    }
    function onMouseMove(e) {
      if (!isLocked) return;
      lon += (e.movementX || 0) * 0.15;
      lat -= (e.movementY || 0) * 0.15;
      lat = Math.max(-85, Math.min(85, lat));
    }
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = performance.now();
      const delta = (time - prevTime) / 1000;
      prevTime = time;

      if (isLocked) {
        phi = THREE.MathUtils.degToRad(90 - lat);
        theta = THREE.MathUtils.degToRad(lon);

        const target = new THREE.Vector3();
        target.x = camera.position.x + Math.sin(phi) * Math.cos(theta);
        target.y = camera.position.y + Math.cos(phi);
        target.z = camera.position.z + Math.sin(phi) * Math.sin(theta);
        camera.lookAt(target);

        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        const speed = 25.0; // Schnelle, flüssige Steuerung
        if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

        camera.translateX(-velocity.x * delta);
        camera.translateZ(velocity.z * delta);
        camera.position.y = 1.7;
        camera.position.x = Math.max(-1.5, Math.min(1.5, camera.position.x));

        // NPC Bewegung
        npcGroup.children.forEach(npc => {
          if (npcBehavior === 'walk') {
            npc.position.z += npcSpeed * delta;
          } else if (npcBehavior === 'stare') {
            npc.lookAt(camera.position.x, npc.position.y, camera.position.z);
          }
        });

        // Effekte & Anomalie Animations-Updates
        if (enableFlickeringLights && Math.random() < 0.1) {
          normalLightsGroup.children.forEach(l => { if(l.isPointLight) l.intensity = Math.random() * 0.9; });
        }
        if (blinkCameraLed) {
          cameraLedMesh.material.color.setHex((Math.floor(time / 400) % 2 === 0) ? 0xff0000 : 0x330000);
        }
        if (animatePostersSliding) {
          postersGroup.children.forEach(p => {
            p.position.z += 0.5 * delta;
            if(p.position.z > 15) p.position.z = -15;
          });
        }
        if (trackPlayerWithPoster && postersGroup.children[1]) {
          postersGroup.children[1].position.z = camera.position.z;
        }

        checkPlayerProgress();
      }

      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
